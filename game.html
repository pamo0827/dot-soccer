<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3vs3 ドットサッカー</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #5eead4;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 8px;
  }
  #game {
    background: #000;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    max-width: 100%;
    max-height: 100%;
    border: 2px solid var(--border);
    border-radius: 4px;
    touch-action: none;
  }
  #touchControls {
    display: none;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    gap: 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  body.touch #touchControls { display: flex; }
  #dpad {
    display: grid;
    grid-template-columns: 40px 40px 40px;
    grid-template-rows: 40px 40px 40px;
    gap: 2px;
  }
  #dpad button { grid-row: auto; }
  .dbtn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    font-size: 16px;
    user-select: none;
    touch-action: none;
  }
  .actions {
    display: flex;
    gap: 10px;
  }
  .actbtn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--border);
    color: #0f1115;
    font-weight: 700;
    font-size: 13px;
    user-select: none;
    touch-action: none;
  }
  #passBtn { background: var(--accent); }
  #shootBtn { background: #f97362; }
  #controlBar {
    flex-shrink: 0;
    height: 28px;
    line-height: 28px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
    background: var(--surface);
    border-top: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 10px;
  }
  #controlBar b { color: var(--accent); }

  #netBar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  #netBar input {
    width: 90px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
  }
  #netBar button {
    background: var(--accent);
    border: none;
    color: #0f1115;
    font-weight: 700;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
  }
  #netBar button.leave {
    background: #f97362;
  }
  #netStatus {
    color: var(--muted);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="400" height="240"></canvas>
  </div>

  <div id="netBar">
    <input id="roomInput" placeholder="ルームコード" maxlength="8" autocomplete="off">
    <button id="joinBtn">接続</button>
    <button id="leaveBtn" class="leave" style="display:none;">切断</button>
    <span id="netStatus">オフライン（1人プレイ）</span>
  </div>

  <div id="touchControls">
    <div id="dpad">
      <span></span><button class="dbtn" data-dir="up">▲</button><span></span>
      <button class="dbtn" data-dir="left">◀</button><span></span><button class="dbtn" data-dir="right">▶</button>
      <span></span><button class="dbtn" data-dir="down">▼</button><span></span>
    </div>
    <div class="actions">
      <button class="actbtn" id="passBtn">PASS</button>
      <button class="actbtn" id="shootBtn">SHOOT</button>
    </div>
  </div>

  <div id="controlBar">
    <b>&#8593;&#8595;&#8592;&#8594;</b> / <b>WASD</b> 移動&nbsp;&nbsp;|&nbsp;&nbsp;<b>X</b> パス&nbsp;&nbsp;|&nbsp;&nbsp;<b>Z</b> / <b>Space</b> シュート
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  // ---------- setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W = canvas.width;   // 400
  const H = canvas.height;  // 240

  // pitch geometry
  const PX0 = 20, PX1 = 380, PY0 = 20, PY1 = 220;
  const PW = PX1 - PX0, PH = PY1 - PY0;
  const CX = (PX0 + PX1) / 2, CY = (PY0 + PY1) / 2;
  const GOAL_Y0 = CY - 25, GOAL_Y1 = CY + 25;
  const GOAL_DEPTH = 10;

  const COLORS = {
    pitch: '#1e6b2e',
    pitchLine: '#e8eaed',
    pitchDark: '#1a5f28',
    teamA: '#4da3ff',
    teamB: '#ff5d5d',
    user: '#ffd54d',
    ball: '#f5f5f0',
    ballLine: '#111',
    text: '#e8eaed',
  };

  const HALF_SECONDS = 60; // 前半/後半 各1分

  // ---------- helpers ----------
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function normalize(x, y) {
    const len = Math.hypot(x, y);
    if (len < 1e-6) return { x: 0, y: 0 };
    return { x: x / len, y: y / len };
  }

  // ---------- entities ----------
  function makePlayer(team, role, isUser, x, y) {
    return {
      team, role, isUser,
      x, y, vx: 0, vy: 0,
      facing: { x: team === 'A' ? 1 : -1, y: 0 },
      radius: 6,
      speed: isUser ? 62 : 56,
      home: { x, y },
      carryTime: 0,
      color: isUser ? COLORS.user : (team === 'A' ? COLORS.teamA : COLORS.teamB),
    };
  }

  // formation: inverted triangle (1 back, 2 forward)
  const teamA = [
    makePlayer('A', 'defender', false, 110, CY),
    makePlayer('A', 'forwardTop', true, 210, CY - 50),
    makePlayer('A', 'forwardBottom', false, 210, CY + 50),
  ];
  const teamB = [
    makePlayer('B', 'defender', false, 290, CY),
    makePlayer('B', 'forwardTop', false, 190, CY - 50),
    makePlayer('B', 'forwardBottom', false, 190, CY + 50),
  ];
  const allPlayers = teamA.concat(teamB);
  const userPlayer = teamA.find(p => p.isUser);

  const ball = {
    x: CX, y: CY, vx: 0, vy: 0, radius: 3,
    carrier: null, kickCooldown: 0,
  };

  // ---------- match state ----------
  const match = {
    half: 1,
    timeLeft: HALF_SECONDS,
    scoreA: 0,
    scoreB: 0,
    state: 'playing', // 'playing' | 'halftime' | 'fulltime' | 'goal'
    pauseTimer: 0,
    attackDirA: 1, // A attacks toward +x this half
  };

  function formationSlot(player) {
    // mirror formation depending on which way each team attacks
    const dirA = match.attackDirA;
    const dirB = -dirA;
    const backOffset = 90, fwdOffset = 10, spread = 50;
    if (player.team === 'A') {
      if (player.role === 'defender') return { x: CX - dirA * backOffset, y: CY };
      if (player.role === 'forwardTop') return { x: CX + dirA * fwdOffset, y: CY - spread };
      return { x: CX + dirA * fwdOffset, y: CY + spread };
    } else {
      if (player.role === 'defender') return { x: CX - dirB * backOffset, y: CY };
      if (player.role === 'forwardTop') return { x: CX + dirB * fwdOffset, y: CY - spread };
      return { x: CX + dirB * fwdOffset, y: CY + spread };
    }
  }

  function resetKickoff() {
    ball.x = CX; ball.y = CY; ball.vx = 0; ball.vy = 0;
    ball.carrier = null; ball.kickCooldown = 0.4;
    for (const p of allPlayers) {
      const slot = formationSlot(p);
      p.x = slot.x; p.y = slot.y;
      p.vx = 0; p.vy = 0;
      p.carryTime = 0;
      p.facing = { x: p.team === 'A' ? match.attackDirA : -match.attackDirA, y: 0 };
    }
  }
  resetKickoff();

  // ---------- input ----------
  const held = new Set();
  const MOVE_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD']);
  const ACTION_KEYS = new Set(['KeyZ','Space','KeyX']);

  window.addEventListener('keydown', (e) => {
    if (MOVE_KEYS.has(e.code) || ACTION_KEYS.has(e.code)) e.preventDefault();
    if (MOVE_KEYS.has(e.code)) held.add(e.code);
    if (e.code === 'KeyZ' || e.code === 'Space') { if (!held.has(e.code)) requestShoot(); held.add(e.code); }
    if (e.code === 'KeyX') { if (!held.has(e.code)) requestPass(); held.add(e.code); }
  }, { passive: false });
  window.addEventListener('keyup', (e) => held.delete(e.code));

  function userMoveVector() {
    let x = 0, y = 0;
    if (held.has('ArrowLeft') || held.has('KeyA')) x -= 1;
    if (held.has('ArrowRight') || held.has('KeyD')) x += 1;
    if (held.has('ArrowUp') || held.has('KeyW')) y -= 1;
    if (held.has('ArrowDown') || held.has('KeyS')) y += 1;
    return normalize(x, y);
  }

  // touch controls
  if ('ontouchstart' in window) document.body.classList.add('touch');
  document.querySelectorAll('.dbtn').forEach(btn => {
    const dir = btn.dataset.dir;
    const code = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }[dir];
    const add = (e) => { e.preventDefault(); held.add(code); };
    const rm = (e) => { e.preventDefault(); held.delete(code); };
    btn.addEventListener('touchstart', add, { passive: false });
    btn.addEventListener('touchend', rm, { passive: false });
    btn.addEventListener('mousedown', add);
    btn.addEventListener('mouseup', rm);
    btn.addEventListener('mouseleave', rm);
  });
  document.getElementById('passBtn').addEventListener('touchstart', (e) => { e.preventDefault(); requestPass(); }, { passive: false });
  document.getElementById('passBtn').addEventListener('click', () => requestPass());
  document.getElementById('shootBtn').addEventListener('touchstart', (e) => { e.preventDefault(); requestShoot(); }, { passive: false });
  document.getElementById('shootBtn').addEventListener('click', () => requestShoot());

  function requestShoot() {
    if (net.role === 'guest') sendGuestAction('shoot');
    else doShoot(userPlayer);
  }
  function requestPass() {
    if (net.role === 'guest') sendGuestAction('pass');
    else doPass(userPlayer);
  }

  // ---------- actions ----------
  function isCarrier(p) { return ball.carrier === p; }

  function opponentGoalX(team) {
    // team A attacks match.attackDirA; goal it shoots at is the far side
    const dir = team === 'A' ? match.attackDirA : -match.attackDirA;
    return dir > 0 ? PX1 : PX0;
  }

  function ownGoalX(team) {
    const dir = team === 'A' ? match.attackDirA : -match.attackDirA;
    return dir > 0 ? PX0 : PX1;
  }

  function doShoot(p) {
    if (!isCarrier(p)) return;
    const dir = p.facing;
    const power = 190;
    ball.vx = dir.x * power;
    ball.vy = dir.y * power * 0.6;
    ball.carrier = null;
    ball.kickCooldown = 0.25;
  }

  function doPass(p) {
    if (!isCarrier(p)) return;
    const teammates = (p.team === 'A' ? teamA : teamB).filter(t => t !== p);
    // prefer a teammate roughly ahead of us (in facing direction), else the nearest
    let best = null, bestScore = -Infinity;
    for (const t of teammates) {
      const toT = normalize(t.x - p.x, t.y - p.y);
      const align = toT.x * p.facing.x + toT.y * p.facing.y; // -1..1
      const d = dist(p, t);
      const score = align * 2 - d / 200;
      if (score > bestScore) { bestScore = score; best = t; }
    }
    if (!best) return;
    const toBest = normalize(best.x - p.x, best.y - p.y);
    const power = 140;
    ball.vx = toBest.x * power;
    ball.vy = toBest.y * power;
    ball.carrier = null;
    ball.kickCooldown = 0.2;
  }

  // ---------- AI ----------
  function teamOf(t) { return t === 'A' ? teamA : teamB; }

  function pickChaser(team) {
    const players = teamOf(team);
    let best = players[0], bestD = Infinity;
    for (const p of players) {
      const d = dist(p, ball);
      if (d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  function updateBotAI(p, dt) {
    const chaser = pickChaser(p.team);
    const teamHasCarrier = teamOf(p.team).some(t => isCarrier(t));

    if (isCarrier(p)) {
      p.carryTime += dt;
      const goalX = opponentGoalX(p.team);
      const distToGoal = Math.abs(goalX - p.x);
      const aligned = Math.abs(p.y - CY) < 22;
      // steer toward goal while dribbling
      const target = { x: goalX, y: CY };
      steerTowards(p, target, dt);
      if (distToGoal < 90 && aligned) {
        doShoot(p);
      } else if (p.carryTime > 1.1) {
        doPass(p);
      }
      return;
    }

    // defenders actively contest anyone threatening their own half
    if (p.role === 'defender') {
      const myGoalX = ownGoalX(p.team);
      if (Math.abs(ball.x - myGoalX) < 170) {
        steerTowards(p, ball, dt);
        return;
      }
    }

    if (p === chaser && !teamHasCarrier) {
      steerTowards(p, ball, dt);
    } else {
      const slot = formationSlot(p);
      const target = {
        x: slot.x + (ball.x - CX) * 0.25,
        y: slot.y + (ball.y - CY) * 0.35,
      };
      target.x = clamp(target.x, PX0 + 15, PX1 - 15);
      target.y = clamp(target.y, PY0 + 10, PY1 - 10);
      steerTowards(p, target, dt);
    }
  }

  function steerTowards(p, target, dt) {
    const dx = target.x - p.x, dy = target.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > 2) {
      const dir = normalize(dx, dy);
      p.vx = dir.x * p.speed;
      p.vy = dir.y * p.speed;
      p.facing = dir;
    } else {
      p.vx = 0; p.vy = 0;
    }
  }

  // ---------- update ----------
  function updateUser(dt) {
    const mv = userMoveVector();
    if (mv.x !== 0 || mv.y !== 0) {
      userPlayer.vx = mv.x * userPlayer.speed;
      userPlayer.vy = mv.y * userPlayer.speed;
      userPlayer.facing = mv;
    } else {
      userPlayer.vx = 0; userPlayer.vy = 0;
    }
    if (isCarrier(userPlayer)) userPlayer.carryTime += dt;
  }

  function integratePlayer(p, dt) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.x = clamp(p.x, PX0 + p.radius, PX1 - p.radius);
    p.y = clamp(p.y, PY0 + p.radius, PY1 - p.radius);
  }

  function separatePlayers() {
    for (let i = 0; i < allPlayers.length; i++) {
      for (let j = i + 1; j < allPlayers.length; j++) {
        const a = allPlayers[i], b = allPlayers[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const minD = a.radius + b.radius + 2;
        if (d > 0 && d < minD) {
          const push = (minD - d) / 2;
          const n = normalize(dx, dy);
          a.x -= n.x * push; a.y -= n.y * push;
          b.x += n.x * push; b.y += n.y * push;
        }
      }
    }
  }

  function updateBall(dt) {
    if (ball.kickCooldown > 0) ball.kickCooldown -= dt;

    if (ball.carrier) {
      const p = ball.carrier;
      ball.x = p.x + p.facing.x * 9;
      ball.y = p.y + p.facing.y * 9;
      ball.vx = 0; ball.vy = 0;
    } else {
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      const friction = Math.pow(0.35, dt); // strong-ish decay
      ball.vx *= friction;
      ball.vy *= friction;

      // bounce off top/bottom pitch walls
      if (ball.y < PY0 + ball.radius) { ball.y = PY0 + ball.radius; ball.vy *= -0.6; }
      if (ball.y > PY1 - ball.radius) { ball.y = PY1 - ball.radius; ball.vy *= -0.6; }

      // bounce off side walls unless inside goal mouth
      const inGoalMouthY = ball.y > GOAL_Y0 && ball.y < GOAL_Y1;
      if (!inGoalMouthY) {
        if (ball.x < PX0 + ball.radius) { ball.x = PX0 + ball.radius; ball.vx *= -0.6; }
        if (ball.x > PX1 - ball.radius) { ball.x = PX1 - ball.radius; ball.vx *= -0.6; }
      }

      // try capture
      if (ball.kickCooldown <= 0) {
        let best = null, bestD = Infinity;
        for (const p of allPlayers) {
          const d = dist(p, ball);
          if (d < p.radius + ball.radius + 3 && d < bestD) { bestD = d; best = p; }
        }
        if (best) { ball.carrier = best; best.carryTime = 0; }
      }
    }
  }

  function checkGoal() {
    if (ball.x <= PX0 - GOAL_DEPTH + 2 && ball.y > GOAL_Y0 && ball.y < GOAL_Y1) {
      scoreGoal(match.attackDirA > 0 ? 'B' : 'A');
    } else if (ball.x >= PX1 + GOAL_DEPTH - 2 && ball.y > GOAL_Y0 && ball.y < GOAL_Y1) {
      scoreGoal(match.attackDirA > 0 ? 'A' : 'B');
    }
  }

  function scoreGoal(team) {
    if (match.state !== 'playing') return;
    if (team === 'A') match.scoreA++; else match.scoreB++;
    match.state = 'goal';
    match.pauseTimer = 1.4;
  }

  function update(dt) {
    if (match.state === 'goal') {
      match.pauseTimer -= dt;
      if (match.pauseTimer <= 0) {
        resetKickoff();
        match.state = 'playing';
      }
      return;
    }
    if (match.state === 'halftime') {
      match.pauseTimer -= dt;
      if (match.pauseTimer <= 0) {
        match.half = 2;
        match.timeLeft = HALF_SECONDS;
        match.attackDirA *= -1; // switch sides
        resetKickoff();
        match.state = 'playing';
      }
      return;
    }
    if (match.state === 'fulltime') return;

    match.timeLeft -= dt;
    if (match.timeLeft <= 0) {
      match.timeLeft = 0;
      if (match.half === 1) {
        match.state = 'halftime';
        match.pauseTimer = 2;
      } else {
        match.state = 'fulltime';
      }
      return;
    }

    updateUser(dt);
    for (const p of allPlayers) if (!p.isUser) updateBotAI(p, dt);
    if (net.role === 'host' && net.guestConnected) applyRemoteInputToPlayer(guestSlot, dt);
    for (const p of allPlayers) integratePlayer(p, dt);
    separatePlayers();
    updateBall(dt);
    checkGoal();
  }

  // ---------- render ----------
  function drawPitch() {
    ctx.fillStyle = '#0c1710';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = COLORS.pitch;
    ctx.fillRect(PX0, PY0, PW, PH);

    // simple mow stripes
    ctx.fillStyle = COLORS.pitchDark;
    const stripeW = PW / 8;
    for (let i = 0; i < 8; i += 2) {
      ctx.fillRect(PX0 + i * stripeW, PY0, stripeW, PH);
    }

    ctx.strokeStyle = COLORS.pitchLine;
    ctx.lineWidth = 1;
    ctx.strokeRect(PX0 + 0.5, PY0 + 0.5, PW - 1, PH - 1);

    // center line + circle
    ctx.beginPath();
    ctx.moveTo(CX, PY0); ctx.lineTo(CX, PY1);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(CX, CY, 22, 0, Math.PI * 2);
    ctx.stroke();

    // goal boxes
    ctx.strokeRect(PX0, GOAL_Y0 - 8, 24, (GOAL_Y1 - GOAL_Y0) + 16);
    ctx.strokeRect(PX1 - 24, GOAL_Y0 - 8, 24, (GOAL_Y1 - GOAL_Y0) + 16);

    // goals (nets)
    ctx.fillStyle = '#cfd3da';
    ctx.fillRect(PX0 - GOAL_DEPTH, GOAL_Y0, GOAL_DEPTH, GOAL_Y1 - GOAL_Y0);
    ctx.fillRect(PX1, GOAL_Y0, GOAL_DEPTH, GOAL_Y1 - GOAL_Y0);
  }

  function drawPlayer(p) {
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + p.radius - 1, p.radius * 0.9, p.radius * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // body (blocky pixel look: draw as small square + circle head)
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x - p.radius), Math.round(p.y - p.radius), p.radius * 2, p.radius * 2);

    ctx.fillStyle = '#111';
    ctx.fillRect(Math.round(p.x - p.radius), Math.round(p.y - p.radius), p.radius * 2, 1);

    // facing indicator
    ctx.fillStyle = '#111';
    const fx = Math.round(p.x + p.facing.x * (p.radius - 1));
    const fy = Math.round(p.y + p.facing.y * (p.radius - 1));
    ctx.fillRect(fx - 1, fy - 1, 2, 2);

    if (p.isUser) {
      ctx.fillStyle = p.markerColor || COLORS.user;
      ctx.beginPath();
      ctx.moveTo(p.x - 4, p.y - p.radius - 6);
      ctx.lineTo(p.x + 4, p.y - p.radius - 6);
      ctx.lineTo(p.x, p.y - p.radius - 2);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBall() {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(ball.x, ball.y + 2, ball.radius, ball.radius * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = COLORS.ball;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = COLORS.ballLine;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function formatTime(t) {
    const s = Math.max(0, Math.ceil(t));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  function drawHUD() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '10px monospace';

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(CX - 60, 4, 120, 12);

    ctx.fillStyle = COLORS.teamA;
    ctx.fillText(String(match.scoreA), CX - 40, 10);
    ctx.fillStyle = COLORS.text;
    ctx.fillText(formatTime(match.timeLeft), CX, 10);
    ctx.fillStyle = COLORS.teamB;
    ctx.fillText(String(match.scoreB), CX + 40, 10);

    ctx.font = '8px monospace';
    ctx.fillStyle = COLORS.muted || '#8b93a1';
    ctx.fillText('H' + match.half, CX, 20);

    if (match.state === 'goal') {
      overlayText('GOAL!');
    } else if (match.state === 'halftime') {
      overlayText('HALF TIME');
    } else if (match.state === 'fulltime') {
      overlayText('FULL TIME  ' + match.scoreA + ' - ' + match.scoreB);
    }
  }

  function overlayText(msg) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, CY - 16, W, 32);
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(msg, CX, CY);
  }

  function render() {
    drawPitch();
    for (const p of allPlayers) drawPlayer(p);
    drawBall();
    drawHUD();
  }

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (net.role !== 'guest') update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- online co-op (Supabase Realtime) ----------
  const guestSlot = teamA[2]; // 2人目のプレイヤーが操作するスロット（普段はbot）
  const SUPABASE_URL = 'https://zgqdkbjfvfllegoeellh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_4jjuAhgQVo9-rB8X4tf9AA_1OrytjOO';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const net = {
    myId: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0, 8),
    channel: null,
    role: null,       // null | 'host' | 'guest'
    roleDecided: false,
    guestConnected: false,
    lastGuestMv: { x: 0, y: 0 },
    sendTimer: null,
  };

  function applyRemoteInputToPlayer(p, dt) {
    const mv = net.lastGuestMv;
    if (mv.x !== 0 || mv.y !== 0) {
      p.vx = mv.x * p.speed;
      p.vy = mv.y * p.speed;
      p.facing = mv;
    } else {
      p.vx = 0; p.vy = 0;
    }
    if (isCarrier(p)) p.carryTime += dt;
  }

  function sendGuestAction(action) {
    if (!net.channel || net.role !== 'guest') return;
    net.channel.send({ type: 'broadcast', event: 'action', payload: { action } });
  }

  function buildSnapshot() {
    return {
      half: match.half, timeLeft: match.timeLeft,
      scoreA: match.scoreA, scoreB: match.scoreB, state: match.state,
      ball: { x: ball.x, y: ball.y },
      players: allPlayers.map(p => ({
        x: p.x, y: p.y, facing: p.facing,
        isUser: !!p.isUser, markerColor: p.markerColor || null,
      })),
    };
  }

  function applySnapshot(s) {
    match.half = s.half; match.timeLeft = s.timeLeft;
    match.scoreA = s.scoreA; match.scoreB = s.scoreB; match.state = s.state;
    ball.x = s.ball.x; ball.y = s.ball.y;
    s.players.forEach((ps, i) => {
      const p = allPlayers[i];
      p.x = ps.x; p.y = ps.y; p.facing = ps.facing;
      p.isUser = ps.isUser; p.markerColor = ps.markerColor || undefined;
    });
  }

  function setNetStatus(text) {
    const el = document.getElementById('netStatus');
    if (el) el.textContent = text;
  }

  function onRoleDecided() {
    if (net.role === 'host') {
      setNetStatus('ホストとして対戦中（部屋: ' + net.roomCode + '）');
      net.sendTimer = setInterval(() => {
        if (net.channel) net.channel.send({ type: 'broadcast', event: 'snapshot', payload: buildSnapshot() });
      }, 70);
    } else {
      setNetStatus('ゲストとして参加中（部屋: ' + net.roomCode + '）');
      net.sendTimer = setInterval(() => {
        if (net.channel) net.channel.send({ type: 'broadcast', event: 'input', payload: { mv: userMoveVector() } });
      }, 70);
    }
  }

  function joinRoom(code) {
    if (net.channel) return;
    net.roomCode = code;
    net.channel = sb.channel('soccer-' + code, { config: { presence: { key: net.myId } } });

    // すべての broadcast/presence リスナーは subscribe() より前に登録する必要がある
    // （subscribe 後に .on() を足しても届かないことがあるため、役割はハンドラ内で判定する）
    net.channel.on('broadcast', { event: 'input' }, (msg) => {
      if (net.role === 'host') net.lastGuestMv = msg.payload.mv;
    });
    net.channel.on('broadcast', { event: 'action' }, (msg) => {
      if (net.role !== 'host') return;
      if (msg.payload.action === 'shoot') doShoot(guestSlot);
      else if (msg.payload.action === 'pass') doPass(guestSlot);
    });
    net.channel.on('broadcast', { event: 'snapshot' }, (msg) => {
      if (net.role === 'guest') applySnapshot(msg.payload);
    });

    net.channel.on('presence', { event: 'sync' }, () => {
      const state = net.channel.presenceState();
      const entries = Object.entries(state).map(([key, metas]) => ({ key, ts: metas[0] ? metas[0].ts : Infinity }));
      if (entries.length === 0) return;
      entries.sort((a, b) => a.ts - b.ts || (a.key < b.key ? -1 : 1));
      const hostKey = entries[0].key;

      if (!net.roleDecided && state[net.myId]) {
        net.role = (hostKey === net.myId) ? 'host' : 'guest';
        net.roleDecided = true;
        onRoleDecided();
      }

      if (net.role === 'host') {
        const nowConnected = entries.length > 1;
        if (nowConnected !== net.guestConnected) {
          net.guestConnected = nowConnected;
          guestSlot.isUser = nowConnected;
          guestSlot.markerColor = nowConnected ? '#4dffb8' : undefined;
          if (!nowConnected) { guestSlot.vx = 0; guestSlot.vy = 0; }
        }
        setNetStatus(nowConnected
          ? 'ホスト：2人目が参加しました（部屋: ' + net.roomCode + '）'
          : 'ホストとして待機中…（部屋: ' + net.roomCode + '）共有して2人目を待ちましょう');
      }
    });

    net.channel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        setNetStatus('接続中…（部屋: ' + code + '）');
        await net.channel.track({ ts: Date.now() });
      }
    });
  }

  function leaveRoom() {
    if (net.sendTimer) clearInterval(net.sendTimer);
    if (net.channel) sb.removeChannel(net.channel);
    if (net.role === 'host') {
      guestSlot.isUser = false;
      guestSlot.markerColor = undefined;
      guestSlot.vx = 0; guestSlot.vy = 0;
    }
    net.channel = null; net.role = null; net.roleDecided = false; net.guestConnected = false;
    setNetStatus('オフライン（1人プレイ）');
    document.getElementById('roomInput').style.display = '';
    document.getElementById('joinBtn').style.display = '';
    document.getElementById('leaveBtn').style.display = 'none';
  }

  document.getElementById('joinBtn').addEventListener('click', () => {
    const input = document.getElementById('roomInput');
    const code = (input.value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8) || 'PARTY1';
    input.value = code;
    joinRoom(code);
    input.style.display = 'none';
    document.getElementById('joinBtn').style.display = 'none';
    document.getElementById('leaveBtn').style.display = '';
    const url = new URL(location.href);
    url.searchParams.set('room', code);
    history.replaceState(null, '', url);
  });
  document.getElementById('leaveBtn').addEventListener('click', leaveRoom);

  const urlRoom = new URLSearchParams(location.search).get('room');
  if (urlRoom) {
    document.getElementById('roomInput').value = urlRoom.toUpperCase();
    document.getElementById('joinBtn').click();
  }
})();
</script>
</body>
</html>
