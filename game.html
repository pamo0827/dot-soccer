<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3vs3 ドットサッカー</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #5eead4;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 4px;
  }
  #game {
    background: #000;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 2px solid var(--border);
    border-radius: 4px;
    touch-action: none;
  }
  #touchControls {
    display: none;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    gap: 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  body.touch #touchControls { display: flex; }
  #dpad {
    display: grid;
    grid-template-columns: 40px 40px 40px;
    grid-template-rows: 40px 40px 40px;
    gap: 2px;
  }
  #dpad button { grid-row: auto; }
  .dbtn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    font-size: 16px;
    user-select: none;
    touch-action: none;
  }
  .actions {
    display: flex;
    gap: 10px;
  }
  .actbtn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--border);
    color: #0f1115;
    font-weight: 700;
    font-size: 13px;
    user-select: none;
    touch-action: none;
  }
  #passBtn { background: var(--accent); }
  #shootBtn { background: #f97362; }
  #tackleBtn { background: #c084fc; }
  #controlBar {
    flex-shrink: 0;
    height: 28px;
    line-height: 28px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
    background: var(--surface);
    border-top: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 10px;
  }
  #controlBar b { color: var(--accent); }

  #netBar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  #netBar input {
    width: 90px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
  }
  #netBar button {
    background: var(--accent);
    border: none;
    color: #0f1115;
    font-weight: 700;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
  }
  #netBar button.leave {
    background: #f97362;
  }
  #netStatus {
    color: var(--muted);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="400" height="240"></canvas>
  </div>

  <div id="netBar">
    <input id="roomInput" placeholder="ルームコード" maxlength="8" autocomplete="off">
    <button id="joinBtn">接続</button>
    <button id="leaveBtn" class="leave" style="display:none;">切断</button>
    <span id="netStatus">オフライン（1人プレイ）</span>
  </div>

  <div id="touchControls">
    <div id="dpad">
      <span></span><button class="dbtn" data-dir="up">▲</button><span></span>
      <button class="dbtn" data-dir="left">◀</button><span></span><button class="dbtn" data-dir="right">▶</button>
      <span></span><button class="dbtn" data-dir="down">▼</button><span></span>
    </div>
    <div class="actions">
      <button class="actbtn" id="passBtn">PASS</button>
      <button class="actbtn" id="shootBtn">SHOOT</button>
      <button class="actbtn" id="tackleBtn">ATTACK</button>
    </div>
  </div>

  <div id="controlBar">
    <b>&#8593;&#8595;&#8592;&#8594;</b> / <b>WASD</b> 移動&nbsp;&nbsp;|&nbsp;&nbsp;<b>X</b> パス&nbsp;&nbsp;|&nbsp;&nbsp;<b>Z</b> / <b>Space</b> シュート&nbsp;&nbsp;|&nbsp;&nbsp;<b>C</b> アタック
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  // ---------- setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W = canvas.width;   // 400
  const H = canvas.height;  // 240

  // pitch geometry
  const PX0 = 20, PX1 = 380, PY0 = 20, PY1 = 220;
  const PW = PX1 - PX0, PH = PY1 - PY0;
  const CX = (PX0 + PX1) / 2, CY = (PY0 + PY1) / 2;
  const GOAL_Y0 = CY - 25, GOAL_Y1 = CY + 25;
  const GOAL_DEPTH = 10;

  const COLORS = {
    pitch: '#1e6b2e',
    pitchLine: '#e8eaed',
    pitchDark: '#1a5f28',
    teamA: '#4da3ff',
    teamB: '#ff5d5d',
    user: '#ffd54d',
    ball: '#f5f5f0',
    ballLine: '#111',
    text: '#e8eaed',
  };

  // ---------- sprites ----------
  const CHAR_FOLDERS = ['human1', 'human2', 'human3'];
  const POSE_FILES = {
    idle: '01_待機.png',
    dribble1: '02_ドリブル1.png',
    dribble2: '03_ドリブル2.png',
    dribble3: '04_ドリブル3.png',
    passPrep: '05_パス_準備.png',
    passExec: '06_パス_実行.png',
    shootPrep: '07_シュート_準備.png',
    shootExec: '08_シュート_実行.png',
    dash: '09_ダッシュ.png',
    jump: '10_ジャンプ.png',
  };
  const SPRITE_BASE_HEIGHT = 34; // 画面手前(scale=1)での表示高さ(px)

  // 赤系ユニフォームの色相だけを狙って青(チームA用)に置き換える
  function recolorRedToBlue(img) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth || img.width;
    c.height = img.naturalHeight || img.height;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    const data = cx.getImageData(0, 0, c.width, c.height);
    const px = data.data;
    for (let i = 0; i < px.length; i += 4) {
      const a = px[i + 3];
      if (a === 0) continue;
      const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2;
      const d = max - min;
      if (d < 0.05) continue; // ほぼ無彩色（肌の陰影・黒髪の線など）はそのまま
      let h;
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
      const s = d / (1 - Math.abs(2 * l - 1));
      // 赤系（ユニフォーム）のみ対象: 色相が0付近 かつ ある程度の彩度
      const isRedHue = (h < 20 || h > 340);
      if (!isRedHue || s < 0.3) continue;
      const targetH = 212; // 青
      const hh = targetH / 60;
      const cc = (1 - Math.abs(2 * l - 1)) * s;
      const x = cc * (1 - Math.abs((hh % 2) - 1));
      const m = l - cc / 2;
      let rr, gg, bb;
      if (hh < 1) { rr = cc; gg = x; bb = 0; }
      else if (hh < 2) { rr = x; gg = cc; bb = 0; }
      else if (hh < 3) { rr = 0; gg = cc; bb = x; }
      else if (hh < 4) { rr = 0; gg = x; bb = cc; }
      else if (hh < 5) { rr = x; gg = 0; bb = cc; }
      else { rr = cc; gg = 0; bb = x; }
      px[i] = Math.round((rr + m) * 255);
      px[i + 1] = Math.round((gg + m) * 255);
      px[i + 2] = Math.round((bb + m) * 255);
    }
    cx.putImageData(data, 0, 0);
    return c;
  }

  const spriteSets = { red: [], blue: [] }; // index: charIndex(0-2) -> {pose: image/canvas}
  CHAR_FOLDERS.forEach((folder, idx) => {
    const redPoses = {};
    const bluePoses = {};
    spriteSets.red[idx] = redPoses;
    spriteSets.blue[idx] = bluePoses;
    Object.keys(POSE_FILES).forEach((poseKey) => {
      const img = new Image();
      img.src = folder + '/' + POSE_FILES[poseKey];
      redPoses[poseKey] = img;
      img.addEventListener('load', () => {
        bluePoses[poseKey] = recolorRedToBlue(img);
      });
    });
  });

  function isNearBall(p) {
    return dist(p, ball) < p.radius + ball.radius + 4;
  }

  function updatePlayerAnim(p, dt) {
    const st = p.anim;
    if (p.action) {
      p.action.t += dt;
      const a = p.action;
      if (a.type === 'shoot') {
        if (a.t < 0.10) st.pose = 'shootPrep';
        else if (a.t < 0.28) st.pose = 'shootExec';
        else { p.action = null; }
      } else if (a.type === 'pass') {
        if (a.t < 0.08) st.pose = 'passPrep';
        else if (a.t < 0.20) st.pose = 'passExec';
        else { p.action = null; }
      } else if (a.type === 'tackle') {
        if (a.t < 0.22) st.pose = 'jump';
        else { p.action = null; }
      }
      if (p.action) return;
    }

    if (Math.abs(p.facing.y) > 0.15) st.flip = p.facing.y < 0;

    const dx = p.x - st.prevX, dy = p.y - st.prevY;
    st.prevX = p.x; st.prevY = p.y;
    const speed = dt > 0 ? Math.hypot(dx, dy) / dt : 0;

    if (speed > 4) {
      if (isNearBall(p)) {
        st.cycleTimer += dt;
        const idx = Math.floor(st.cycleTimer * 8) % 3;
        st.pose = ['dribble1', 'dribble2', 'dribble3'][idx];
      } else {
        st.pose = 'dash';
      }
    } else {
      st.pose = 'idle';
      st.cycleTimer = 0;
    }
  }

  const HALF_SECONDS = 60; // 前半/後半 各1分

  // ---------- camera projection ----------
  // シミュレーション自体は今まで通り真上から見た座標系(x,y)のまま。
  // 描画時だけ、PX0側のゴール裏から約60度の仰角でPX1側のゴールを見通す簡易パースに変換する。
  // 奥行き軸はピッチの長さ方向(x)。手前(PX0, カメラ側)=大きく広い、奥(PX1)=小さく狭い。
  const FAR_SCALE = 0.32;           // 奥のゴール(最遠点)の横幅スケール
  const SCREEN_TOP = 14;            // 奥のゴールラインを描画するY座標
  const SCREEN_BOTTOM = H - 4;      // 手前のゴールラインを描画するY座標
  const SCREEN_CENTER_X = W / 2;
  const NEAR_HALF_WIDTH = W / 2 - 4; // 画面いっぱいに近い横幅を使う
  const WORLD_TO_NEAR = (NEAR_HALF_WIDTH * 2) / PH;

  function depthFrac(x) {
    return (x - PX0) / PW; // 0=手前(PX0, カメラ側), 1=奥(PX1)
  }

  // ボールを追いかける横パン（左右方向のみ、ゆっくり追従）
  const camera = { panY: CY };
  const PAN_STRENGTH = 0.35; // 1.0だとタッチライン際でピッチが画面外に出てしまうため弱める
  function updateCamera(dt) {
    const target = CY + (clamp(ball.y, PY0, PY1) - CY) * PAN_STRENGTH;
    const k = 1 - Math.pow(0.001, dt); // 追従の滑らかさ（1秒でほぼ収束）
    camera.panY += (target - camera.panY) * k;
  }

  function projectWithDepth(x, y, depth01) {
    const d = 1 - depth01; // 0=奥, 1=手前 の従来表記に合わせる
    const s = FAR_SCALE + (1 - FAR_SCALE) * d;
    return {
      x: SCREEN_CENTER_X + (y - camera.panY) * WORLD_TO_NEAR * s,
      y: SCREEN_TOP + d * (SCREEN_BOTTOM - SCREEN_TOP),
      scale: s,
    };
  }

  function project(x, y) {
    return projectWithDepth(x, y, clamp(depthFrac(x), 0, 1));
  }

  // ゴールネットの奥行き表現用: 手前ゴールの裏側などピッチ範囲外もクランプせず延長する
  function projectRaw(x, y) {
    return projectWithDepth(x, y, depthFrac(x));
  }

  function projectPoly(points) {
    return points.map(([x, y]) => project(x, y));
  }

  function drawPoly(pts, fillStyle, strokeStyle) {
    if (pts.length === 0) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    if (fillStyle) { ctx.fillStyle = fillStyle; ctx.fill(); }
    if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = 1; ctx.stroke(); }
  }

  // ---------- helpers ----------
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function normalize(x, y) {
    const len = Math.hypot(x, y);
    if (len < 1e-6) return { x: 0, y: 0 };
    return { x: x / len, y: y / len };
  }

  // ---------- entities ----------
  function makePlayer(team, role, isUser, x, y, charIndex) {
    return {
      team, role, isUser, charIndex,
      x, y, vx: 0, vy: 0,
      facing: { x: team === 'A' ? 1 : -1, y: 0 },
      radius: 6,
      speed: isUser ? 62 : 22,
      home: { x, y },
      carryTime: 0,
      tackleCooldown: 0,
      color: isUser ? COLORS.user : (team === 'A' ? COLORS.teamA : COLORS.teamB),
      action: null,
      anim: { pose: 'idle', cycleTimer: 0, flip: team !== 'A', prevX: x, prevY: y },
    };
  }

  // formation: inverted triangle (1 back, 2 forward)
  const teamA = [
    makePlayer('A', 'defender', false, 110, CY, 0),
    makePlayer('A', 'forwardTop', true, 210, CY - 50, 1),
    makePlayer('A', 'forwardBottom', false, 210, CY + 50, 2),
  ];
  const teamB = [
    makePlayer('B', 'defender', false, 290, CY, 0),
    makePlayer('B', 'forwardTop', false, 190, CY - 50, 1),
    makePlayer('B', 'forwardBottom', false, 190, CY + 50, 2),
  ];
  const allPlayers = teamA.concat(teamB);
  const userPlayer = teamA.find(p => p.isUser);

  const ball = {
    x: CX, y: CY, vx: 0, vy: 0, radius: 3,
    carrier: null, kickCooldown: 0,
  };

  // ---------- match state ----------
  const match = {
    half: 1,
    timeLeft: HALF_SECONDS,
    scoreA: 0,
    scoreB: 0,
    state: 'playing', // 'playing' | 'halftime' | 'fulltime' | 'goal'
    pauseTimer: 0,
    attackDirA: 1, // A attacks toward +x this half
  };

  function formationSlot(player) {
    // mirror formation depending on which way each team attacks
    const dirA = match.attackDirA;
    const dirB = -dirA;
    const backOffset = 90, fwdOffset = 10, spread = 50;
    if (player.team === 'A') {
      if (player.role === 'defender') return { x: CX - dirA * backOffset, y: CY };
      if (player.role === 'forwardTop') return { x: CX + dirA * fwdOffset, y: CY - spread };
      return { x: CX + dirA * fwdOffset, y: CY + spread };
    } else {
      if (player.role === 'defender') return { x: CX - dirB * backOffset, y: CY };
      if (player.role === 'forwardTop') return { x: CX + dirB * fwdOffset, y: CY - spread };
      return { x: CX + dirB * fwdOffset, y: CY + spread };
    }
  }

  function resetKickoff() {
    ball.x = CX; ball.y = CY; ball.vx = 0; ball.vy = 0;
    ball.carrier = null; ball.kickCooldown = 0.4;
    for (const p of allPlayers) {
      const slot = formationSlot(p);
      p.x = slot.x; p.y = slot.y;
      p.vx = 0; p.vy = 0;
      p.carryTime = 0;
      p.facing = { x: p.team === 'A' ? match.attackDirA : -match.attackDirA, y: 0 };
    }
  }
  resetKickoff();

  // ---------- input ----------
  const held = new Set();
  const MOVE_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD']);
  const ACTION_KEYS = new Set(['KeyZ','Space','KeyX','KeyC']);

  window.addEventListener('keydown', (e) => {
    if (MOVE_KEYS.has(e.code) || ACTION_KEYS.has(e.code)) e.preventDefault();
    if (MOVE_KEYS.has(e.code)) held.add(e.code);
    if (e.code === 'KeyZ' || e.code === 'Space') { if (!held.has(e.code)) requestShoot(); held.add(e.code); }
    if (e.code === 'KeyX') { if (!held.has(e.code)) requestPass(); held.add(e.code); }
    if (e.code === 'KeyC') { if (!held.has(e.code)) requestTackle(); held.add(e.code); }
  }, { passive: false });
  window.addEventListener('keyup', (e) => held.delete(e.code));

  // カメラが「ゴール裏から見た画角」になっているため、キー入力は画面上の見た目の方向
  // (上=奥へ, 下=手前へ, 左右=画面の左右) に合わせてワールド座標(x=奥行き, y=左右)へ変換する
  function userMoveVector() {
    let x = 0, y = 0;
    if (held.has('ArrowUp') || held.has('KeyW')) x += 1;    // 画面奥へ
    if (held.has('ArrowDown') || held.has('KeyS')) x -= 1;   // 画面手前へ
    if (held.has('ArrowLeft') || held.has('KeyA')) y -= 1;   // 画面左へ
    if (held.has('ArrowRight') || held.has('KeyD')) y += 1;  // 画面右へ
    return normalize(x, y);
  }

  // touch controls
  if ('ontouchstart' in window) document.body.classList.add('touch');
  document.querySelectorAll('.dbtn').forEach(btn => {
    const dir = btn.dataset.dir;
    const code = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }[dir];
    const add = (e) => { e.preventDefault(); held.add(code); };
    const rm = (e) => { e.preventDefault(); held.delete(code); };
    btn.addEventListener('touchstart', add, { passive: false });
    btn.addEventListener('touchend', rm, { passive: false });
    btn.addEventListener('mousedown', add);
    btn.addEventListener('mouseup', rm);
    btn.addEventListener('mouseleave', rm);
  });
  document.getElementById('passBtn').addEventListener('touchstart', (e) => { e.preventDefault(); requestPass(); }, { passive: false });
  document.getElementById('passBtn').addEventListener('click', () => requestPass());
  document.getElementById('shootBtn').addEventListener('touchstart', (e) => { e.preventDefault(); requestShoot(); }, { passive: false });
  document.getElementById('shootBtn').addEventListener('click', () => requestShoot());
  document.getElementById('tackleBtn').addEventListener('touchstart', (e) => { e.preventDefault(); requestTackle(); }, { passive: false });
  document.getElementById('tackleBtn').addEventListener('click', () => requestTackle());

  function requestShoot() {
    if (net.role === 'guest') sendGuestAction('shoot');
    else doShoot(userPlayer);
  }
  function requestPass() {
    if (net.role === 'guest') sendGuestAction('pass');
    else doPass(userPlayer);
  }
  function requestTackle() {
    if (net.role === 'guest') sendGuestAction('tackle');
    else doTackle(userPlayer);
  }

  // ---------- actions ----------
  function isCarrier(p) { return ball.carrier === p; }

  function opponentGoalX(team) {
    // team A attacks match.attackDirA; goal it shoots at is the far side
    const dir = team === 'A' ? match.attackDirA : -match.attackDirA;
    return dir > 0 ? PX1 : PX0;
  }

  function ownGoalX(team) {
    const dir = team === 'A' ? match.attackDirA : -match.attackDirA;
    return dir > 0 ? PX0 : PX1;
  }

  function doShoot(p, power) {
    if (!isCarrier(p)) return;
    const dir = p.facing;
    const pw = power || (p.isUser ? 190 : 95); // bot の shot は弱い
    ball.vx = dir.x * pw;
    ball.vy = dir.y * pw * 0.6;
    ball.carrier = null;
    ball.kickCooldown = 0.25;
    p.action = { type: 'shoot', t: 0 };
  }

  function doPass(p) {
    if (!isCarrier(p)) return;
    const teammates = (p.team === 'A' ? teamA : teamB).filter(t => t !== p);
    // prefer a teammate roughly ahead of us (in facing direction), else the nearest
    let best = null, bestScore = -Infinity;
    for (const t of teammates) {
      const toT = normalize(t.x - p.x, t.y - p.y);
      const align = toT.x * p.facing.x + toT.y * p.facing.y; // -1..1
      const d = dist(p, t);
      const score = align * 2 - d / 200;
      if (score > bestScore) { bestScore = score; best = t; }
    }
    if (!best) return;
    const toBest = normalize(best.x - p.x, best.y - p.y);
    const power = 140;
    ball.vx = toBest.x * power;
    ball.vy = toBest.y * power;
    ball.carrier = null;
    ball.kickCooldown = 0.2;
    p.action = { type: 'pass', t: 0 };
  }

  const TACKLE_RANGE = 14;
  function doTackle(p) {
    if (isCarrier(p)) return;
    if (p.tackleCooldown > 0) return;
    p.tackleCooldown = 0.5;
    let target = null, bestD = Infinity;
    for (const o of allPlayers) {
      if (o.team === p.team || !isCarrier(o)) continue;
      const d = dist(p, o);
      if (d < TACKLE_RANGE && d < bestD) { bestD = d; target = o; }
    }
    p.action = { type: 'tackle', t: 0 };
    if (!target) return;
    // 成功率: 完全な奪取ではなくボールをこぼす（ルーズボールにする）
    ball.carrier = null;
    ball.kickCooldown = 0.15;
    const away = normalize(ball.x - target.x, ball.y - target.y);
    ball.vx = (away.x || (Math.random() - 0.5)) * 60;
    ball.vy = (away.y || (Math.random() - 0.5)) * 60;
    target.carryTime = 0;
    target.action = null;
  }

  // ---------- AI ----------
  function teamOf(t) { return t === 'A' ? teamA : teamB; }

  const BOT_CHASE_RANGE = 55; // この距離より遠いボールは追わない（ユーザー頼み）

  function pickChaser(team) {
    const players = teamOf(team);
    let best = null, bestD = Infinity;
    for (const p of players) {
      if (p.isUser) continue;
      const d = dist(p, ball);
      if (d < bestD) { bestD = d; best = p; }
    }
    if (best && bestD > BOT_CHASE_RANGE) return null;
    return best;
  }

  function updateBotAI(p, dt) {
    if (p.tackleCooldown > 0) p.tackleCooldown -= dt;
    const chaser = pickChaser(p.team);
    const teamHasCarrier = teamOf(p.team).some(t => isCarrier(t));

    if (isCarrier(p)) {
      p.carryTime += dt;
      const goalX = opponentGoalX(p.team);
      const distToGoal = Math.abs(goalX - p.x);
      const aligned = Math.abs(p.y - CY) < 18;
      // steer toward goal while dribbling
      const target = { x: goalX, y: CY };
      steerTowards(p, target, dt);
      if (distToGoal < 45 && aligned) {
        doShoot(p);
      } else if (p.carryTime > 2.2) {
        doPass(p);
      }
      return;
    }

    // defenders only weakly contest anyone very close to their own goal
    if (p.role === 'defender') {
      const myGoalX = ownGoalX(p.team);
      if (Math.abs(ball.x - myGoalX) < 60) {
        steerTowards(p, ball, dt);
        return;
      }
    }

    if (p === chaser && !teamHasCarrier) {
      steerTowards(p, ball, dt);
    } else {
      const slot = formationSlot(p);
      const target = {
        x: slot.x + (ball.x - CX) * 0.25,
        y: slot.y + (ball.y - CY) * 0.35,
      };
      target.x = clamp(target.x, PX0 + 15, PX1 - 15);
      target.y = clamp(target.y, PY0 + 10, PY1 - 10);
      steerTowards(p, target, dt);
    }
  }

  function steerTowards(p, target, dt) {
    const dx = target.x - p.x, dy = target.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > 2) {
      const dir = normalize(dx, dy);
      p.vx = dir.x * p.speed;
      p.vy = dir.y * p.speed;
      p.facing = dir;
    } else {
      p.vx = 0; p.vy = 0;
    }
  }

  // ---------- update ----------
  function updateUser(dt) {
    const mv = userMoveVector();
    if (mv.x !== 0 || mv.y !== 0) {
      userPlayer.vx = mv.x * userPlayer.speed;
      userPlayer.vy = mv.y * userPlayer.speed;
      userPlayer.facing = mv;
    } else {
      userPlayer.vx = 0; userPlayer.vy = 0;
    }
    if (isCarrier(userPlayer)) userPlayer.carryTime += dt;
    if (userPlayer.tackleCooldown > 0) userPlayer.tackleCooldown -= dt;
  }

  function integratePlayer(p, dt) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.x = clamp(p.x, PX0 + p.radius, PX1 - p.radius);
    p.y = clamp(p.y, PY0 + p.radius, PY1 - p.radius);
  }

  function separatePlayers() {
    for (let i = 0; i < allPlayers.length; i++) {
      for (let j = i + 1; j < allPlayers.length; j++) {
        const a = allPlayers[i], b = allPlayers[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const minD = a.radius + b.radius + 2;
        if (d > 0 && d < minD) {
          const push = (minD - d) / 2;
          const n = normalize(dx, dy);
          a.x -= n.x * push; a.y -= n.y * push;
          b.x += n.x * push; b.y += n.y * push;
        }
      }
    }
  }

  function updateBall(dt) {
    if (ball.kickCooldown > 0) ball.kickCooldown -= dt;

    if (ball.carrier) {
      const p = ball.carrier;
      ball.x = p.x + p.facing.x * 9;
      ball.y = p.y + p.facing.y * 9;
      ball.vx = 0; ball.vy = 0;
    } else {
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      const friction = Math.pow(0.35, dt); // strong-ish decay
      ball.vx *= friction;
      ball.vy *= friction;

      // bounce off top/bottom pitch walls
      if (ball.y < PY0 + ball.radius) { ball.y = PY0 + ball.radius; ball.vy *= -0.6; }
      if (ball.y > PY1 - ball.radius) { ball.y = PY1 - ball.radius; ball.vy *= -0.6; }

      // bounce off side walls unless inside goal mouth
      const inGoalMouthY = ball.y > GOAL_Y0 && ball.y < GOAL_Y1;
      if (!inGoalMouthY) {
        if (ball.x < PX0 + ball.radius) { ball.x = PX0 + ball.radius; ball.vx *= -0.6; }
        if (ball.x > PX1 - ball.radius) { ball.x = PX1 - ball.radius; ball.vx *= -0.6; }
      }

      // try capture
      if (ball.kickCooldown <= 0) {
        let best = null, bestD = Infinity;
        for (const p of allPlayers) {
          const d = dist(p, ball);
          if (d < p.radius + ball.radius + 3 && d < bestD) { bestD = d; best = p; }
        }
        if (best) { ball.carrier = best; best.carryTime = 0; }
      }
    }
  }

  function checkGoal() {
    if (ball.x <= PX0 - GOAL_DEPTH + 2 && ball.y > GOAL_Y0 && ball.y < GOAL_Y1) {
      scoreGoal(match.attackDirA > 0 ? 'B' : 'A');
    } else if (ball.x >= PX1 + GOAL_DEPTH - 2 && ball.y > GOAL_Y0 && ball.y < GOAL_Y1) {
      scoreGoal(match.attackDirA > 0 ? 'A' : 'B');
    }
  }

  function scoreGoal(team) {
    if (match.state !== 'playing') return;
    if (team === 'A') match.scoreA++; else match.scoreB++;
    match.state = 'goal';
    match.pauseTimer = 1.4;
  }

  function update(dt) {
    if (match.state === 'goal') {
      match.pauseTimer -= dt;
      if (match.pauseTimer <= 0) {
        resetKickoff();
        match.state = 'playing';
      }
      return;
    }
    if (match.state === 'halftime') {
      match.pauseTimer -= dt;
      if (match.pauseTimer <= 0) {
        match.half = 2;
        match.timeLeft = HALF_SECONDS;
        match.attackDirA *= -1; // switch sides
        resetKickoff();
        match.state = 'playing';
      }
      return;
    }
    if (match.state === 'fulltime') return;

    match.timeLeft -= dt;
    if (match.timeLeft <= 0) {
      match.timeLeft = 0;
      if (match.half === 1) {
        match.state = 'halftime';
        match.pauseTimer = 2;
      } else {
        match.state = 'fulltime';
      }
      return;
    }

    updateUser(dt);
    for (const p of allPlayers) if (!p.isUser) updateBotAI(p, dt);
    if (net.role === 'host' && net.guestConnected) applyRemoteInputToPlayer(guestSlot, dt);
    for (const p of allPlayers) integratePlayer(p, dt);
    separatePlayers();
    updateBall(dt);
    checkGoal();
  }

  // ---------- render ----------
  function drawPitch() {
    ctx.fillStyle = '#0c1710';
    ctx.fillRect(0, 0, W, H);

    // pitch base (trapezoid: far edge narrow, near edge wide)
    drawPoly(projectPoly([[PX0, PY0], [PX1, PY0], [PX1, PY1], [PX0, PY1]]), COLORS.pitch, null);

    // mow stripes
    const stripeW = PW / 8;
    for (let i = 0; i < 8; i += 2) {
      const xA = PX0 + i * stripeW, xB = xA + stripeW;
      drawPoly(projectPoly([[xA, PY0], [xB, PY0], [xB, PY1], [xA, PY1]]), COLORS.pitchDark, null);
    }

    // outer boundary
    drawPoly(projectPoly([[PX0, PY0], [PX1, PY0], [PX1, PY1], [PX0, PY1]]), null, COLORS.pitchLine);

    // center line
    ctx.strokeStyle = COLORS.pitchLine;
    ctx.lineWidth = 1;
    const cTop = project(CX, PY0), cBot = project(CX, PY1);
    ctx.beginPath();
    ctx.moveTo(cTop.x, cTop.y); ctx.lineTo(cBot.x, cBot.y);
    ctx.stroke();

    // center circle (sampled polygon so it warps naturally with the perspective)
    const circlePts = [];
    for (let i = 0; i <= 24; i++) {
      const t = (i / 24) * Math.PI * 2;
      circlePts.push([CX + Math.cos(t) * 22, CY + Math.sin(t) * 22]);
    }
    drawPoly(projectPoly(circlePts), null, COLORS.pitchLine);

    // goal boxes
    drawPoly(projectPoly([[PX0, GOAL_Y0 - 8], [PX0 + 24, GOAL_Y0 - 8], [PX0 + 24, GOAL_Y1 + 8], [PX0, GOAL_Y1 + 8]]), null, COLORS.pitchLine);
    drawPoly(projectPoly([[PX1, GOAL_Y0 - 8], [PX1 - 24, GOAL_Y0 - 8], [PX1 - 24, GOAL_Y1 + 8], [PX1, GOAL_Y1 + 8]]), null, COLORS.pitchLine);

    drawGoalFrame(PX0, 1);
    drawGoalFrame(PX1, -1);
  }

  // 3D風のゴールフレーム（ゴールラインから立ち上がるネットを簡易表現）
  function drawGoalFrame(lineX, outwardDir) {
    const postWorldHeight = 22;
    // 2本のポストは同じ奥行き(x=lineX)、幅方向(y)にだけ左右に離れている
    const postA = project(lineX, GOAL_Y0);
    const postB = project(lineX, GOAL_Y1);
    const postATop = { x: postA.x, y: postA.y - postWorldHeight * postA.scale };
    const postBTop = { x: postB.x, y: postB.y - postWorldHeight * postB.scale };

    // ネットの奥行き（ゴールラインの外側へ）。手前ゴールは画面外へはみ出してOK
    const backX = lineX + outwardDir * GOAL_DEPTH;
    const backA = projectRaw(backX, GOAL_Y0);
    const backB = projectRaw(backX, GOAL_Y1);
    const backATop = { x: backA.x, y: backA.y - postWorldHeight * backA.scale * 0.7 };
    const backBTop = { x: backB.x, y: backB.y - postWorldHeight * backB.scale * 0.7 };

    // net (back wall)
    ctx.fillStyle = 'rgba(230,235,240,0.35)';
    ctx.beginPath();
    ctx.moveTo(backATop.x, backATop.y); ctx.lineTo(backBTop.x, backBTop.y);
    ctx.lineTo(backB.x, backB.y); ctx.lineTo(backA.x, backA.y);
    ctx.closePath(); ctx.fill();

    // side net + crossbar
    ctx.strokeStyle = '#dfe3ea';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(postA.x, postA.y); ctx.lineTo(postATop.x, postATop.y);
    ctx.lineTo(postBTop.x, postBTop.y); ctx.lineTo(postB.x, postB.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(postATop.x, postATop.y); ctx.lineTo(backATop.x, backATop.y);
    ctx.moveTo(postBTop.x, postBTop.y); ctx.lineTo(backBTop.x, backBTop.y);
    ctx.stroke();
  }

  function drawPlayerBlock(p, proj) {
    const r = p.radius * proj.scale;
    const sx = proj.x, sy = proj.y;
    const bodyTop = sy - r * 2;

    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(sx - r), Math.round(bodyTop), r * 2, r * 2);

    ctx.fillStyle = '#111';
    ctx.fillRect(Math.round(sx - r), Math.round(bodyTop), r * 2, Math.max(1, proj.scale));

    // facing indicator
    ctx.fillStyle = '#111';
    const fx = Math.round(sx + p.facing.x * (r - 1));
    const fy = Math.round(bodyTop + r + p.facing.y * (r - 1));
    const fs = Math.max(1, Math.round(2 * proj.scale));
    ctx.fillRect(fx - fs / 2, fy - fs / 2, fs, fs);
    return bodyTop;
  }

  function drawPlayer(p) {
    const proj = project(p.x, p.y);
    const sx = proj.x, sy = proj.y;
    const r = p.radius * proj.scale;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(sx, sy, r * 0.9, r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    const set = p.team === 'A' ? spriteSets.blue : spriteSets.red;
    const poses = set[p.charIndex];
    const img = poses && poses[p.anim.pose];
    let bodyTop;

    if (img && (img instanceof HTMLCanvasElement || img.complete)) {
      const dh = SPRITE_BASE_HEIGHT * proj.scale;
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const dw = dh * (iw / ih);
      bodyTop = sy - dh;
      ctx.save();
      if (p.anim.flip) {
        ctx.translate(sx, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(img, Math.round(-dw / 2), Math.round(bodyTop), Math.round(dw), Math.round(dh));
      } else {
        ctx.drawImage(img, Math.round(sx - dw / 2), Math.round(bodyTop), Math.round(dw), Math.round(dh));
      }
      ctx.restore();
    } else {
      bodyTop = drawPlayerBlock(p, proj);
    }

    if (p.isUser) {
      ctx.fillStyle = p.markerColor || COLORS.user;
      ctx.beginPath();
      ctx.moveTo(sx - 4 * proj.scale, bodyTop - 6 * proj.scale);
      ctx.lineTo(sx + 4 * proj.scale, bodyTop - 6 * proj.scale);
      ctx.lineTo(sx, bodyTop - 2 * proj.scale);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBall() {
    const proj = project(ball.x, ball.y);
    const r = Math.max(1.5, ball.radius * proj.scale);
    const sx = proj.x, sy = proj.y;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + r * 0.6, r, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = COLORS.ball;
    ctx.beginPath();
    ctx.arc(sx, sy - r, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = COLORS.ballLine;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function formatTime(t) {
    const s = Math.max(0, Math.ceil(t));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  function drawHUD() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '10px monospace';

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(SCREEN_CENTER_X - 60, 4, 120, 12);

    ctx.fillStyle = COLORS.teamA;
    ctx.fillText(String(match.scoreA), SCREEN_CENTER_X - 40, 10);
    ctx.fillStyle = COLORS.text;
    ctx.fillText(formatTime(match.timeLeft), SCREEN_CENTER_X, 10);
    ctx.fillStyle = COLORS.teamB;
    ctx.fillText(String(match.scoreB), SCREEN_CENTER_X + 40, 10);

    if (match.state === 'goal') {
      overlayText('GOAL!');
    } else if (match.state === 'halftime') {
      overlayText('HALF TIME');
    } else if (match.state === 'fulltime') {
      overlayText('FULL TIME  ' + match.scoreA + ' - ' + match.scoreB);
    }
  }

  function overlayText(msg) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, H / 2 - 16, W, 32);
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(msg, SCREEN_CENTER_X, H / 2);
  }

  function render(dt) {
    for (const p of allPlayers) updatePlayerAnim(p, dt);
    drawPitch();
    const drawables = allPlayers.concat([ball]);
    drawables.sort((a, b) => b.x - a.x); // far-to-near painter's order (奥=PX1側 から手前=PX0側の順)
    for (const d of drawables) {
      if (d === ball) drawBall(); else drawPlayer(d);
    }
    drawHUD();
  }

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (net.role !== 'guest') update(dt);
    updateCamera(dt);
    render(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- online co-op (Supabase Realtime) ----------
  const guestSlot = teamA[2]; // 2人目のプレイヤーが操作するスロット（普段はbot）
  const SUPABASE_URL = 'https://zgqdkbjfvfllegoeellh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_4jjuAhgQVo9-rB8X4tf9AA_1OrytjOO';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const net = {
    myId: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0, 8),
    channel: null,
    role: null,       // null | 'host' | 'guest'
    roleDecided: false,
    guestConnected: false,
    lastGuestMv: { x: 0, y: 0 },
    sendTimer: null,
  };

  function applyRemoteInputToPlayer(p, dt) {
    const mv = net.lastGuestMv;
    if (mv.x !== 0 || mv.y !== 0) {
      p.vx = mv.x * p.speed;
      p.vy = mv.y * p.speed;
      p.facing = mv;
    } else {
      p.vx = 0; p.vy = 0;
    }
    if (isCarrier(p)) p.carryTime += dt;
    if (p.tackleCooldown > 0) p.tackleCooldown -= dt;
  }

  function sendGuestAction(action) {
    if (!net.channel || net.role !== 'guest') return;
    net.channel.send({ type: 'broadcast', event: 'action', payload: { action } });
  }

  function buildSnapshot() {
    return {
      half: match.half, timeLeft: match.timeLeft,
      scoreA: match.scoreA, scoreB: match.scoreB, state: match.state,
      ball: { x: ball.x, y: ball.y },
      players: allPlayers.map(p => ({
        x: p.x, y: p.y, facing: p.facing,
        isUser: !!p.isUser, markerColor: p.markerColor || null,
      })),
    };
  }

  function applySnapshot(s) {
    match.half = s.half; match.timeLeft = s.timeLeft;
    match.scoreA = s.scoreA; match.scoreB = s.scoreB; match.state = s.state;
    ball.x = s.ball.x; ball.y = s.ball.y;
    s.players.forEach((ps, i) => {
      const p = allPlayers[i];
      p.x = ps.x; p.y = ps.y; p.facing = ps.facing;
      p.isUser = ps.isUser; p.markerColor = ps.markerColor || undefined;
    });
  }

  function setNetStatus(text) {
    const el = document.getElementById('netStatus');
    if (el) el.textContent = text;
  }

  function onRoleDecided() {
    if (net.role === 'host') {
      setNetStatus('ホストとして対戦中（部屋: ' + net.roomCode + '）');
      net.sendTimer = setInterval(() => {
        if (net.channel) net.channel.send({ type: 'broadcast', event: 'snapshot', payload: buildSnapshot() });
      }, 70);
    } else {
      setNetStatus('ゲストとして参加中（部屋: ' + net.roomCode + '）');
      net.sendTimer = setInterval(() => {
        if (net.channel) net.channel.send({ type: 'broadcast', event: 'input', payload: { mv: userMoveVector() } });
      }, 70);
    }
  }

  function joinRoom(code) {
    if (net.channel) return;
    net.roomCode = code;
    net.channel = sb.channel('soccer-' + code, { config: { presence: { key: net.myId } } });

    // すべての broadcast/presence リスナーは subscribe() より前に登録する必要がある
    // （subscribe 後に .on() を足しても届かないことがあるため、役割はハンドラ内で判定する）
    net.channel.on('broadcast', { event: 'input' }, (msg) => {
      if (net.role === 'host') net.lastGuestMv = msg.payload.mv;
    });
    net.channel.on('broadcast', { event: 'action' }, (msg) => {
      if (net.role !== 'host') return;
      if (msg.payload.action === 'shoot') doShoot(guestSlot);
      else if (msg.payload.action === 'pass') doPass(guestSlot);
      else if (msg.payload.action === 'tackle') doTackle(guestSlot);
    });
    net.channel.on('broadcast', { event: 'snapshot' }, (msg) => {
      if (net.role === 'guest') applySnapshot(msg.payload);
    });

    net.channel.on('presence', { event: 'sync' }, () => {
      const state = net.channel.presenceState();
      const entries = Object.entries(state).map(([key, metas]) => ({ key, ts: metas[0] ? metas[0].ts : Infinity }));
      if (entries.length === 0) return;
      entries.sort((a, b) => a.ts - b.ts || (a.key < b.key ? -1 : 1));
      const hostKey = entries[0].key;

      if (!net.roleDecided && state[net.myId]) {
        net.role = (hostKey === net.myId) ? 'host' : 'guest';
        net.roleDecided = true;
        onRoleDecided();
      }

      if (net.role === 'host') {
        const nowConnected = entries.length > 1;
        if (nowConnected !== net.guestConnected) {
          net.guestConnected = nowConnected;
          guestSlot.isUser = nowConnected;
          guestSlot.markerColor = nowConnected ? '#4dffb8' : undefined;
          if (!nowConnected) { guestSlot.vx = 0; guestSlot.vy = 0; }
        }
        setNetStatus(nowConnected
          ? 'ホスト：2人目が参加しました（部屋: ' + net.roomCode + '）'
          : 'ホストとして待機中…（部屋: ' + net.roomCode + '）共有して2人目を待ちましょう');
      }
    });

    net.channel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        setNetStatus('接続中…（部屋: ' + code + '）');
        await net.channel.track({ ts: Date.now() });
      }
    });
  }

  function leaveRoom() {
    if (net.sendTimer) clearInterval(net.sendTimer);
    if (net.channel) sb.removeChannel(net.channel);
    if (net.role === 'host') {
      guestSlot.isUser = false;
      guestSlot.markerColor = undefined;
      guestSlot.vx = 0; guestSlot.vy = 0;
    }
    net.channel = null; net.role = null; net.roleDecided = false; net.guestConnected = false;
    setNetStatus('オフライン（1人プレイ）');
    document.getElementById('roomInput').style.display = '';
    document.getElementById('joinBtn').style.display = '';
    document.getElementById('leaveBtn').style.display = 'none';
  }

  document.getElementById('joinBtn').addEventListener('click', () => {
    const input = document.getElementById('roomInput');
    const code = (input.value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8) || 'PARTY1';
    input.value = code;
    joinRoom(code);
    input.style.display = 'none';
    document.getElementById('joinBtn').style.display = 'none';
    document.getElementById('leaveBtn').style.display = '';
    const url = new URL(location.href);
    url.searchParams.set('room', code);
    history.replaceState(null, '', url);
  });
  document.getElementById('leaveBtn').addEventListener('click', leaveRoom);

  const urlRoom = new URLSearchParams(location.search).get('room');
  if (urlRoom) {
    document.getElementById('roomInput').value = urlRoom.toUpperCase();
    document.getElementById('joinBtn').click();
  }
})();
</script>
</body>
</html>
