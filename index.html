<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Hackathon</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #5eead4;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 56px;
    text-align: center;
    max-width: 440px;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(94, 234, 212, 0.12);
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0;
  }
  .meta {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Deploy OK</span>
    <h1>AI-Hackathon</h1>
    <p>Vercelへのデプロイ確認用テストページです。</p>
    <div class="meta">
      <span>GitHub → Vercel</span>
      <span id="time"></span>
    </div>
  </div>
  <script>
    document.getElementById('time').textContent = new Date().toLocaleString('ja-JP');
  </script>
</body>
</html>
