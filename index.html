<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Hackathon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0b0e17;
    --bg-2: #151a2b;
    --surface: rgba(255, 255, 255, 0.06);
    --surface-border: rgba(255, 255, 255, 0.12);
    --text: #f2f4f8;
    --muted: #9aa3b5;
    --accent: #7dd3fc;
    --accent-2: #c084fc;
    --accent-3: #5eead4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, var(--bg-2), var(--bg-1) 60%);
    color: var(--text);
    font-family: "Sora", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    position: relative;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    animation: float 14s ease-in-out infinite;
    z-index: 0;
  }
  .orb-1 {
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    top: -80px;
    left: -100px;
    animation-delay: 0s;
  }
  .orb-2 {
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    bottom: -100px;
    right: -80px;
    animation-delay: -5s;
  }
  .orb-3 {
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, var(--accent-3), transparent 70%);
    top: 60%;
    left: 55%;
    animation-delay: -9s;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -40px) scale(1.08); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--surface-border);
    border-radius: 20px;
    padding: 52px 58px;
    text-align: center;
    max-width: 460px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(125, 211, 252, 0.15), rgba(192, 132, 252, 0.15));
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-3);
    box-shadow: 0 0 8px var(--accent-3);
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 10px;
    background: linear-gradient(90deg, #ffffff, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.01em;
  }

  p {
    color: var(--muted);
    line-height: 1.7;
    margin: 0;
    font-size: 15px;
  }

  .meta {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--surface-border);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .meta span:first-child {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">
    <span class="badge">Deploy OK</span>
    <h1>AI-Hackathon</h1>
    <p>Vercelへのデプロイ確認用テストページです。</p>
    <div class="meta">
      <span>GitHub → Vercel</span>
      <span id="time"></span>
    </div>
  </div>

  <script>
    document.getElementById('time').textContent = new Date().toLocaleString('ja-JP');
  </script>
</body>
</html>
