<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Hackathon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --bg-2: #14131a;
    --ink: #f4efe4;
    --muted: #9c9689;
    --gold: #d4af7a;
    --gold-soft: rgba(212, 175, 122, 0.35);
    --surface: rgba(255, 255, 255, 0.045);
    --surface-border: rgba(212, 175, 122, 0.22);
    --stage-color: #ffb56b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Noto Serif JP", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    position: relative;
    cursor: default;
  }

  /* ===== HOME SCREEN ===== */
  .aurora {
    position: absolute;
    inset: -20%;
    z-index: 0;
    background:
      radial-gradient(38% 32% at 18% 22%, rgba(212, 175, 122, 0.16), transparent 70%),
      radial-gradient(30% 28% at 82% 78%, rgba(122, 155, 212, 0.12), transparent 70%),
      radial-gradient(26% 24% at 78% 18%, rgba(180, 122, 212, 0.09), transparent 70%),
      conic-gradient(from 0deg at 50% 50%, var(--bg), var(--bg-2), var(--bg));
    animation: drift 30s linear infinite;
    filter: blur(10px);
  }
  @keyframes drift {
    0%   { transform: rotate(0deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1.15); }
  }

  .spotlight {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: radial-gradient(480px circle at var(--mx, 50%) var(--my, 50%), rgba(212, 175, 122, 0.07), transparent 60%);
    pointer-events: none;
    transition: background 0.15s ease-out;
  }

  .grain {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0.05;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  #homeScreen { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #homeScreen.hidden { display: none; }

  .card {
    position: relative;
    z-index: 3;
    background: var(--surface);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--surface-border);
    border-radius: 4px;
    padding: 64px 68px;
    text-align: center;
    max-width: 480px;
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .rule {
    width: 36px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto 22px;
    opacity: 0.7;
  }

  .badge {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 999px;
    border: 1px solid var(--gold-soft);
    color: var(--gold);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  h1 {
    font-family: "Playfair Display", "Noto Serif JP", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 42px;
    margin: 0 0 14px;
    background: linear-gradient(120deg, #ffffff 10%, var(--gold) 60%, #ffffff 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.01em;
  }

  p {
    color: var(--muted);
    line-height: 1.9;
    margin: 0;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  .meta {
    margin-top: 34px;
    padding-top: 24px;
    border-top: 1px solid var(--surface-border);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
  }

  .start-btn {
    margin-top: 32px;
    width: 100%;
    padding: 15px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }
  .start-btn:hover {
    background: var(--gold);
    color: #14120c;
    box-shadow: 0 0 30px rgba(212, 175, 122, 0.35);
  }

  /* music control */
  .music {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .music-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .music-bars.on { opacity: 1; }
  .music-bars span {
    width: 3px;
    height: 4px;
    background: var(--gold);
    border-radius: 2px;
    transform-origin: bottom;
  }

  .music-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--gold);
    transition: border-color 0.25s ease, transform 0.25s ease;
  }
  .music-btn:hover { border-color: var(--gold-soft); transform: scale(1.05); }
  .music-btn svg { width: 16px; height: 16px; }
  .music-btn .pause { display: none; }
  .music-btn.playing .play { display: none; }
  .music-btn.playing .pause { display: block; }

  /* ===== EPIC KUSOGE ===== */
  #gameScreen, #stageClearScreen, #finalClearScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Press Start 2P", monospace;
    background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--stage-color) 18%, #04040a), #04040a 75%);
    transition: background 0.6s ease;
  }
  #gameScreen.show, #stageClearScreen.show, #finalClearScreen.show { display: flex; }

  .stage-banner {
    color: var(--stage-color);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-shadow: 0 0 12px color-mix(in srgb, var(--stage-color) 70%, transparent);
    margin-bottom: 6px;
    text-align: center;
    transition: color 0.6s ease, text-shadow 0.6s ease;
  }
  .kusoge-sub {
    color: #cfc9d8;
    font-size: 8.5px;
    margin-bottom: 16px;
    opacity: 0.8;
    text-align: center;
  }

  .canvas-frame {
    position: relative;
    padding: 10px;
    border-radius: 10px;
    background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
    border: 1px solid color-mix(in srgb, var(--stage-color) 45%, transparent);
    box-shadow: 0 0 50px color-mix(in srgb, var(--stage-color) 25%, transparent), 0 20px 60px rgba(0,0,0,0.6);
    transition: border-color 0.6s ease, box-shadow 0.6s ease;
  }
  #gameCanvas {
    display: block;
    border-radius: 4px;
    image-rendering: pixelated;
    max-width: 88vw;
  }
  .canvas-frame.shake { animation: shake 0.25s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-8px, 4px); }
    50% { transform: translate(8px, -4px); }
    75% { transform: translate(-6px, -6px); }
  }

  .hud {
    display: flex;
    justify-content: space-between;
    width: min(680px, 88vw);
    margin-top: 14px;
    color: #fff;
    font-size: 10px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
  }
  #lives { letter-spacing: 4px; }
  .progress-wrap {
    width: min(680px, 88vw);
    height: 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    margin-top: 8px;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--stage-color), #fff);
    transition: background 0.6s ease;
  }

  /* stage clear / final clear */
  .clear-title {
    font-size: 28px;
    color: #fff;
    text-align: center;
    text-shadow: 0 0 24px color-mix(in srgb, var(--stage-color) 80%, transparent), 3px 3px 0 rgba(0,0,0,0.5);
    animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  #finalClearScreen .clear-title { font-size: 38px; }
  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .clear-sub {
    margin-top: 18px;
    color: #d8d2e6;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-align: center;
  }
  .clear-actions { margin-top: 30px; display: flex; gap: 14px; }
  .kusoge-btn {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    padding: 13px 20px;
    background: rgba(255,255,255,0.05);
    color: #fff;
    border: 1px solid var(--stage-color);
    border-radius: 4px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .kusoge-btn:hover { background: color-mix(in srgb, var(--stage-color) 25%, transparent); }
  .kusoge-btn:active { transform: translateY(2px); }

  .firework-piece {
    position: absolute;
    top: -20px;
    width: 8px;
    height: 8px;
    z-index: 1;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>

  <!-- ================= HOME SCREEN ================= -->
  <div id="homeScreen">
    <div class="aurora"></div>
    <div class="spotlight" id="spotlight"></div>
    <svg class="grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
      <rect width="100%" height="100%" filter="url(#noise)"/>
    </svg>

    <div class="card">
      <div class="rule"></div>
      <span class="badge">Deploy OK</span>
      <h1>AI&nbsp;Hackathon</h1>
      <p>Vercelへのデプロイ確認用テストページです。</p>
      <button class="start-btn" id="startBtn">START</button>
      <div class="meta">
        <span>GitHub → Vercel</span>
        <span id="time"></span>
      </div>
    </div>
  </div>

  <div class="music">
    <div class="music-bars" id="bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <button class="music-btn" id="musicBtn" aria-label="Toggle ambient music">
      <svg class="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
  </div>

  <!-- ================= GAME SCREEN ================= -->
  <div id="gameScreen">
    <div class="stage-banner" id="stageBanner">STAGE 1 / 3 — 黄昏の草原</div>
    <div class="kusoge-sub">SPACE / タップ でジャンプ（空中でもう一度でダブルジャンプ）</div>
    <div class="canvas-frame" id="canvasFrame">
      <canvas id="gameCanvas" width="680" height="240"></canvas>
    </div>
    <div class="hud">
      <span id="lives">❤️❤️❤️</span>
      <span id="distanceLabel">0%</span>
    </div>
    <div class="progress-wrap"><div id="progressBar"></div></div>
  </div>

  <!-- ================= STAGE CLEAR ================= -->
  <div id="stageClearScreen">
    <div class="clear-title" id="stageClearTitle">STAGE 1 CLEAR!</div>
    <div class="clear-sub">つぎのステージへ…</div>
  </div>

  <!-- ================= FINAL CLEAR ================= -->
  <div id="finalClearScreen">
    <div class="clear-title">ALL CLEAR!!</div>
    <div class="clear-sub">3ステージ制覇！壮大な冒険、お疲れさまでした🎉</div>
    <div class="clear-actions">
      <button class="kusoge-btn" id="retryBtn">最初から</button>
      <button class="kusoge-btn" id="homeBtn">ホームへ</button>
    </div>
  </div>

  <script>
    document.getElementById('time').textContent = new Date().toLocaleString('ja-JP');

    // cursor spotlight
    const spotlight = document.getElementById('spotlight');
    window.addEventListener('pointermove', (e) => {
      spotlight.style.setProperty('--mx', e.clientX + 'px');
      spotlight.style.setProperty('--my', e.clientY + 'px');
    });

    // ================= PROCEDURAL BGM (2-minute seamless loop) =================
    const NOTE = {
      C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
      C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
      C5:523.25, D5:587.33, E5:659.25, G5:783.99
    };
    // 16 chords x 7.5s = 120s (2 min), loops seamlessly back to chord 1
    const progression = [
      ['A3','C4','E4','A4'], ['F3','A3','C4','F4'], ['C3','E3','G3','C4'], ['G3','B3','D4','G4'],
      ['E3','G3','B3','E4'], ['A3','C4','E4','A4'], ['D3','F3','A3','D4'], ['G3','B3','D4','G4'],
      ['A3','E4','A4','C5'], ['F3','C4','F4','A4'], ['C3','G3','C4','E4'], ['G3','D4','G4','B4'],
      ['D3','A3','D4','F4'], ['E3','B3','E4','G4'], ['A3','C4','E4','A4'], ['A3','B3','E4','A4'],
    ];
    const CHORD_DUR = 7.5;

    let audioCtx, master, delayNode, filter, analyser;
    let chordIndex = 0, chordTimer = null, isPlaying = false;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain();
      master.gain.value = 0.0001;

      filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1800;

      delayNode = audioCtx.createDelay(2.0);
      delayNode.delayTime.value = 0.55;
      const feedback = audioCtx.createGain();
      feedback.gain.value = 0.32;
      const delayMix = audioCtx.createGain();
      delayMix.gain.value = 0.35;
      delayNode.connect(feedback);
      feedback.connect(delayNode);
      delayNode.connect(delayMix);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 32;

      filter.connect(master);
      filter.connect(delayNode);
      delayMix.connect(master);
      master.connect(analyser);
      analyser.connect(audioCtx.destination);

      master.gain.linearRampToValueAtTime(0.16, audioCtx.currentTime + 3);
    }

    function sparkle(notes, now, dur) {
      for (let i = 0; i < 4; i++) {
        const t = now + (i / 4) * dur + Math.random() * 0.3;
        const freq = NOTE[notes[Math.floor(Math.random() * notes.length)]] * 2;
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.035, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
        osc.connect(g);
        g.connect(delayNode);
        osc.start(t);
        osc.stop(t + 0.7);
      }
    }

    function playChord(notes) {
      const now = audioCtx.currentTime;
      const dur = CHORD_DUR;

      notes.forEach((n, i) => {
        const freq = NOTE[n];
        [1, 1.003].forEach((detune) => {
          const osc = audioCtx.createOscillator();
          osc.type = i === 0 ? 'triangle' : 'sine';
          osc.frequency.value = freq * detune;

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.09 / notes.length, now + 2.4);
          gain.gain.linearRampToValueAtTime(0.06 / notes.length, now + dur - 2);
          gain.gain.linearRampToValueAtTime(0, now + dur);

          osc.connect(gain);
          gain.connect(filter);
          osc.start(now);
          osc.stop(now + dur + 0.1);
        });
      });

      // slow bass drone, one octave below the root
      const bassOsc = audioCtx.createOscillator();
      bassOsc.type = 'sine';
      bassOsc.frequency.value = NOTE[notes[0]] / 2;
      const bassGain = audioCtx.createGain();
      bassGain.gain.setValueAtTime(0, now);
      bassGain.gain.linearRampToValueAtTime(0.05, now + 2);
      bassGain.gain.linearRampToValueAtTime(0.05, now + dur - 2);
      bassGain.gain.linearRampToValueAtTime(0, now + dur);
      bassOsc.connect(bassGain);
      bassGain.connect(filter);
      bassOsc.start(now);
      bassOsc.stop(now + dur + 0.1);

      sparkle(notes, now, dur);

      // slow filter breathing
      filter.frequency.cancelScheduledValues(now);
      filter.frequency.setValueAtTime(filter.frequency.value, now);
      filter.frequency.linearRampToValueAtTime(2400, now + dur / 2);
      filter.frequency.linearRampToValueAtTime(1500, now + dur);
    }

    function tick() {
      playChord(progression[chordIndex % progression.length]);
      chordIndex++;
    }

    const bars = document.querySelectorAll('#bars span');
    const barsWrap = document.getElementById('bars');
    let rafId;
    function animateBars() {
      if (!analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      bars.forEach((bar, i) => {
        const v = data[i + 1] || 0;
        bar.style.height = 4 + (v / 255) * 16 + 'px';
      });
      rafId = requestAnimationFrame(animateBars);
    }

    const musicBtn = document.getElementById('musicBtn');
    function stopMusic() {
      if (!isPlaying) return;
      isPlaying = false;
      musicBtn.classList.remove('playing');
      barsWrap.classList.remove('on');
      master.gain.cancelScheduledValues(audioCtx.currentTime);
      master.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
      clearInterval(chordTimer);
      cancelAnimationFrame(rafId);
      setTimeout(() => bars.forEach(b => b.style.height = '4px'), 300);
    }
    function startMusic() {
      if (isPlaying) return;
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isPlaying = true;
      musicBtn.classList.add('playing');
      barsWrap.classList.add('on');
      tick();
      chordTimer = setInterval(tick, CHORD_DUR * 1000);
      animateBars();
    }
    musicBtn.addEventListener('click', () => { isPlaying ? stopMusic() : startMusic(); });

    // ---- tiny sfx engine ----
    let sfxCtx;
    function beep(freq, dur, type, vol) {
      if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = sfxCtx.createOscillator();
      const gain = sfxCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.12, sfxCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(sfxCtx.destination);
      osc.start();
      osc.stop(sfxCtx.currentTime + dur);
    }
    const sfxJump = (n) => beep(n > 1 ? 700 : 520, 0.12, 'square', 0.1);
    const sfxHit = () => beep(110, 0.3, 'sawtooth', 0.14);
    const sfxStageClear = () => [659, 880, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'square', 0.11), i * 110));
    const sfxAllClear = () => [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'square', 0.12), i * 130));

    // ================= EPIC 3-STAGE KUSOGE =================
    const homeScreen = document.getElementById('homeScreen');
    const gameScreen = document.getElementById('gameScreen');
    const stageClearScreen = document.getElementById('stageClearScreen');
    const finalClearScreen = document.getElementById('finalClearScreen');
    const canvas = document.getElementById('gameCanvas');
    const canvasFrame = document.getElementById('canvasFrame');
    const ctx = canvas.getContext('2d');
    const livesEl = document.getElementById('lives');
    const distanceLabel = document.getElementById('distanceLabel');
    const progressBar = document.getElementById('progressBar');
    const stageBanner = document.getElementById('stageBanner');
    const stageClearTitle = document.getElementById('stageClearTitle');

    const GROUND_Y = 190;
    const GRAVITY = 0.62;
    const JUMP_VELOCITY = -11.5;
    const MAX_JUMPS = 2;

    const STAGES = [
      {
        name: '第一幕：黄昏の草原', color: '#ffb56b', ground: '#1c3a26', groundLine: '#7ee787',
        obstacle: '#5b3a24', decor: 'hills', goal: 3000, speed: 4.0,
        spawnMin: 85, spawnMax: 145, tallChance: 0,
      },
      {
        name: '第二幕：深夜のネオン街', color: '#14d1ff', ground: '#0e0a1c', groundLine: '#ff2ec4',
        obstacle: '#ff6fd8', decor: 'city', goal: 4200, speed: 4.6,
        spawnMin: 75, spawnMax: 128, tallChance: 0.32,
      },
      {
        name: '第三幕：銀河のフィナーレ', color: '#ffd76b', ground: '#080418', groundLine: '#ffd76b',
        obstacle: '#ff8b3d', decor: 'stars', goal: 5400, speed: 5.2,
        spawnMin: 65, spawnMax: 112, tallChance: 0.42,
      },
    ];

    let stageIdx, player, obstacles, distance, lives, gameRunning, nextSpawnAt, invincibleUntil, gameLoopId;
    let decorOffset = 0, shootingStar = null, nextShootingStarAt = 0;

    function applyStageTheme(stage) {
      document.documentElement.style.setProperty('--stage-color', stage.color);
      stageBanner.textContent = `STAGE ${stageIdx + 1} / 3 — ${stage.name}`;
    }

    function resetStage() {
      const stage = STAGES[stageIdx];
      player = { x: 76, y: GROUND_Y - 28, vy: 0, w: 28, h: 28, jumps: 0, grounded: true };
      obstacles = [];
      distance = 0;
      lives = 3;
      gameRunning = true;
      nextSpawnAt = 60;
      invincibleUntil = 0;
      decorOffset = 0;
      shootingStar = null;
      nextShootingStarAt = 200 + Math.random() * 300;
      livesEl.textContent = '❤️'.repeat(lives);
      progressBar.style.width = '0%';
      distanceLabel.textContent = '0%';
      applyStageTheme(stage);
    }

    function jump() {
      if (!gameRunning) return;
      if (player.jumps < MAX_JUMPS) {
        player.vy = JUMP_VELOCITY * (player.jumps === 0 ? 1 : 0.88);
        player.jumps += 1;
        player.grounded = false;
        sfxJump(player.jumps);
      }
    }

    function spawnObstacle() {
      const stage = STAGES[stageIdx];
      const tall = Math.random() < stage.tallChance;
      const h = tall ? 66 + Math.random() * 26 : 22 + Math.random() * 26;
      obstacles.push({ x: canvas.width + 20, y: GROUND_Y - h, w: tall ? 24 : 22, h, tall });
    }

    function hashWave(n) {
      const s = Math.sin(n * 12.9898) * 43758.5453;
      return s - Math.floor(s);
    }

    function drawHills(stage) {
      const layers = [
        { amp: 14, base: GROUND_Y - 8, freq: 0.012, factor: 0.15, alpha: 0.35 },
        { amp: 22, base: GROUND_Y + 2, freq: 0.008, factor: 0.3, alpha: 0.5 },
        { amp: 30, base: GROUND_Y + 14, freq: 0.005, factor: 0.5, alpha: 0.75 },
      ];
      layers.forEach((l) => {
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        for (let x = 0; x <= canvas.width; x += 10) {
          const y = l.base - Math.sin((x + decorOffset * l.factor) * l.freq) * l.amp - l.amp;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fillStyle = `rgba(20,60,40,${l.alpha})`;
        ctx.fill();
      });
    }

    function drawCity(stage) {
      [{ w: 46, factor: 0.25, alpha: 0.5 }, { w: 34, factor: 0.5, alpha: 0.85 }].forEach((layer) => {
        const off = decorOffset * layer.factor;
        const count = Math.ceil(canvas.width / layer.w) + 2;
        for (let i = -1; i < count; i++) {
          const colIndex = Math.floor((off + i * layer.w) / layer.w);
          const h = 26 + hashWave(colIndex + layer.w) * 90;
          const x = i * layer.w - (off % layer.w);
          ctx.fillStyle = `rgba(15,8,30,${layer.alpha})`;
          ctx.fillRect(x, GROUND_Y - h, layer.w - 5, h);
          if (hashWave(colIndex * 3.1) > 0.45) {
            ctx.fillStyle = 'rgba(255,143,216,0.8)';
            ctx.fillRect(x + 6, GROUND_Y - h + 12, 4, 4);
            ctx.fillRect(x + 16, GROUND_Y - h + 24, 4, 4);
          }
        }
      });
    }

    function drawStars(stage) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(canvas.width - 80, 46, 26, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,215,107,0.5)';
      ctx.fill();

      for (let i = 0; i < 70; i++) {
        const x = ((i * 53 - decorOffset * 0.2) % (canvas.width + 40) + canvas.width + 40) % (canvas.width + 40) - 20;
        const y = (hashWave(i) * (GROUND_Y - 20));
        const tw = 0.4 + Math.abs(Math.sin(performance.now() / 400 + i));
        ctx.fillStyle = `rgba(255,255,255,${0.25 + tw * 0.4})`;
        ctx.fillRect(x, y, 2, 2);
      }

      nextShootingStarAt -= 1;
      if (nextShootingStarAt <= 0 && !shootingStar) {
        shootingStar = { x: canvas.width * 0.7, y: 20, life: 30 };
        nextShootingStarAt = 260 + Math.random() * 260;
      }
      if (shootingStar) {
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(shootingStar.x, shootingStar.y);
        ctx.lineTo(shootingStar.x + 26, shootingStar.y - 14);
        ctx.stroke();
        shootingStar.x -= 6;
        shootingStar.y += 3.2;
        shootingStar.life -= 1;
        if (shootingStar.life <= 0) shootingStar = null;
      }
    }

    function update() {
      if (!gameRunning) return;
      const stage = STAGES[stageIdx];

      distance += stage.speed;
      decorOffset += stage.speed;
      nextSpawnAt -= 1;
      if (nextSpawnAt <= 0) {
        spawnObstacle();
        nextSpawnAt = stage.spawnMin + Math.random() * (stage.spawnMax - stage.spawnMin);
      }

      player.vy += GRAVITY;
      player.y += player.vy;
      if (player.y >= GROUND_Y - player.h) {
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.jumps = 0;
      }

      obstacles.forEach(o => o.x -= stage.speed);
      obstacles = obstacles.filter(o => o.x + o.w > -10);

      const now = performance.now();
      if (now > invincibleUntil) {
        for (const o of obstacles) {
          const pad = 7;
          const hit =
            player.x + pad < o.x + o.w &&
            player.x + player.w - pad > o.x &&
            player.y + pad < o.y + o.h &&
            player.y + player.h - pad > o.y;
          if (hit) {
            lives -= 1;
            livesEl.textContent = '❤️'.repeat(Math.max(lives, 0)) + '🖤'.repeat(3 - Math.max(lives, 0));
            invincibleUntil = now + 1200;
            canvasFrame.classList.add('shake');
            setTimeout(() => canvasFrame.classList.remove('shake'), 250);
            sfxHit();
            obstacles = obstacles.filter(ob => ob !== o);
            if (lives <= 0) resetStage();
            break;
          }
        }
      }

      const pct = Math.min(100, Math.floor((distance / stage.goal) * 100));
      progressBar.style.width = pct + '%';
      distanceLabel.textContent = pct + '%';

      if (distance >= stage.goal) {
        gameRunning = false;
        onStageCleared();
      }
    }

    function draw() {
      const stage = STAGES[stageIdx];
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (stage.decor === 'hills') drawHills(stage);
      else if (stage.decor === 'city') drawCity(stage);
      else drawStars(stage);

      ctx.fillStyle = stage.ground;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
      ctx.fillStyle = stage.groundLine;
      ctx.fillRect(0, GROUND_Y, canvas.width, 3);

      const blink = performance.now() < invincibleUntil && Math.floor(performance.now() / 80) % 2 === 0;
      if (!blink) {
        ctx.fillStyle = stage.color;
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = '#14120c';
        ctx.fillRect(player.x + 6, player.y + 7, 5, 5);
        ctx.fillRect(player.x + 17, player.y + 7, 5, 5);
      }

      ctx.fillStyle = stage.obstacle;
      obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

      const goalX = canvas.width - 30;
      ctx.fillStyle = stage.color;
      ctx.fillRect(goalX, GROUND_Y - 100, 4, 100);
      ctx.font = '9px "Press Start 2P"';
      ctx.fillStyle = '#fff';
      ctx.fillText('GOAL', goalX - 14, GROUND_Y - 104);
    }

    function loop() {
      update();
      draw();
      if (gameRunning) gameLoopId = requestAnimationFrame(loop);
    }

    function spawnConfetti(count) {
      const colors = ['#ff2ec4', '#14d1ff', '#ffd76b', '#33ff5e', '#fff', STAGES[stageIdx] ? STAGES[stageIdx].color : '#fff'];
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'firework-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4200);
      }
    }

    function onStageCleared() {
      cancelAnimationFrame(gameLoopId);
      sfxStageClear();
      spawnConfetti(35);

      if (stageIdx < STAGES.length - 1) {
        stageClearTitle.textContent = `STAGE ${stageIdx + 1} CLEAR!`;
        gameScreen.classList.remove('show');
        stageClearScreen.classList.add('show');
        setTimeout(() => {
          stageClearScreen.classList.remove('show');
          stageIdx += 1;
          gameScreen.classList.add('show');
          resetStage();
          loop();
        }, 1800);
      } else {
        gameScreen.classList.remove('show');
        finalClearScreen.classList.add('show');
        sfxAllClear();
        spawnConfetti(90);
      }
    }

    function startGame() {
      homeScreen.classList.add('hidden');
      finalClearScreen.classList.remove('show');
      stageClearScreen.classList.remove('show');
      gameScreen.classList.add('show');
      stageIdx = 0;
      resetStage();
      cancelAnimationFrame(gameLoopId);
      loop();
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    document.getElementById('homeBtn').addEventListener('click', () => {
      finalClearScreen.classList.remove('show');
      gameScreen.classList.remove('show');
      homeScreen.classList.remove('hidden');
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });
    canvas.addEventListener('pointerdown', jump);
  </script>
</body>
</html>
