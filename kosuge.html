<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3vs3 ドットサッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
  :root{
    --bg:#080b10; --surface:#141922; --text:#e8eaed; --muted:#8b93a1;
    --accent:#5eead4; --danger:#f97362; --border:#2a3140;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;height:100dvh}

  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
  #frame{position:relative;height:100%;aspect-ratio:16/9;max-width:100%;max-height:100%}
  #game{width:100%;height:100%;display:block;background:#000;
    image-rendering:pixelated;image-rendering:crisp-edges;
    border:2px solid var(--border);border-radius:4px;touch-action:none}

  /* ---- 左下に常設する操作パネル ---- */
  #hud{position:absolute;left:10px;bottom:10px;z-index:5;
    background:rgba(8,12,16,.78);border:1px solid rgba(255,255,255,.16);
    border-radius:6px;padding:7px 9px;font-size:11px;line-height:1.7;
    backdrop-filter:blur(2px);user-select:none;max-width:min(46%,260px)}
  #hud .row{display:flex;align-items:center;gap:7px;white-space:nowrap}
  #hud .keys{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:5px}
  #hud .k{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:10px}
  #hud kbd{font-family:"Press Start 2P",monospace;font-size:8px;background:#222a36;
    border:1px solid #3a4454;border-bottom-width:2px;border-radius:3px;
    padding:3px 4px;color:#dfe5ee;min-width:16px;text-align:center;display:inline-block}
  #hud .lbl{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--accent);letter-spacing:.08em}
  #volRange{-webkit-appearance:none;appearance:none;width:78px;height:5px;background:#2b3442;
    border-radius:3px;outline:none}
  #volRange::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:14px;background:var(--accent);
    border-radius:2px;cursor:pointer}
  #volRange::-moz-range-thumb{width:10px;height:14px;background:var(--accent);border:0;border-radius:2px;cursor:pointer}
  #muteBtn{background:#222a36;border:1px solid #3a4454;color:var(--text);border-radius:4px;
    width:24px;height:20px;font-size:11px;cursor:pointer;padding:0}
  #hudToggle{position:absolute;right:4px;top:2px;background:none;border:0;color:var(--muted);
    cursor:pointer;font-size:11px;line-height:1;padding:2px}
  #hud.min .keys,#hud.min .volrow{display:none}

  /* ---- 通信待機画面のルーム入力 ---- */
  #netOverlay{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);z-index:6;
    display:none;gap:6px;align-items:center}
  #netOverlay.on{display:flex}
  #roomInput{width:150px;background:#0d1219;border:2px solid var(--border);color:var(--text);
    border-radius:4px;padding:7px 9px;font-family:"Press Start 2P",monospace;font-size:11px;
    letter-spacing:.12em;text-align:center;text-transform:uppercase}
  #roomInput:focus{outline:none;border-color:var(--accent)}
  .nbtn{font-family:"Press Start 2P",monospace;font-size:9px;background:var(--accent);
    border:0;color:#08121a;border-radius:4px;padding:9px 12px;cursor:pointer;letter-spacing:.06em}
  .nbtn.leave{background:var(--danger);color:#160a08}

  #loading{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:8;
    background:rgba(6,12,16,.9);border:1px solid rgba(94,234,212,.5);border-radius:4px;
    padding:6px 12px;font-family:"Press Start 2P",monospace;font-size:9px;color:var(--accent);
    letter-spacing:.14em}
  #loading.off{display:none}

  /* ---- タッチ操作 ---- */
  #touch{display:none;flex-shrink:0;justify-content:space-between;align-items:center;
    padding:6px 10px;gap:12px;background:var(--surface);border-top:1px solid var(--border)}
  body.touch #touch{display:flex}
  #dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:2px}
  .dbtn,.abtn{background:#1a212c;border:1px solid var(--border);color:var(--text);
    border-radius:6px;user-select:none;touch-action:none;font-size:15px}
  .acts{display:flex;gap:8px}
  .abtn{width:56px;height:56px;border-radius:50%;font-family:"Press Start 2P",monospace;
    font-size:9px;font-weight:700;color:#08121a}
  #tShoot{background:var(--danger)} #tPass{background:var(--accent)} #tMenu{background:#8b93a1;width:44px;height:44px;align-self:center}
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="game" width="480" height="270"></canvas>

      <div id="hud">
        <button id="hudToggle" title="開閉">−</button>
        <div class="row volrow">
          <span class="lbl">VOL</span>
          <button id="muteBtn" title="ミュート">♪</button>
          <input id="volRange" type="range" min="0" max="100" value="70" aria-label="音量">
          <span id="volNum" class="lbl">70</span>
        </div>
        <div class="keys">
          <span class="k"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>移動</span>
          <span class="k"><kbd>O</kbd>シュート</span>
          <span class="k"><kbd>P</kbd>パス</span>
          <span class="k"><kbd>SPC</kbd>ポーズ</span>
          <span class="k" id="kJanken"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>じゃんけん</span>
        </div>
      </div>

      <div id="netOverlay">
        <input id="roomInput" placeholder="ROOM" maxlength="8" autocomplete="off">
        <button id="joinBtn" class="nbtn">せつぞく</button>
        <button id="leaveBtn" class="nbtn leave" style="display:none">きりだん</button>
      </div>

      <div id="loading" class="off">LOADING…</div>
    </div>
  </div>

  <div id="touch">
    <div id="dpad">
      <span></span><button class="dbtn" data-k="KeyW">▲</button><span></span>
      <button class="dbtn" data-k="KeyA">◀</button><button class="dbtn" data-k="Space">▪</button><button class="dbtn" data-k="KeyD">▶</button>
      <span></span><button class="dbtn" data-k="KeyS">▼</button><span></span>
    </div>
    <div class="acts">
      <button class="abtn" id="tPass">PASS</button>
      <button class="abtn" id="tShoot">SHOOT</button>
    </div>
  </div>

<script src="audio-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
"use strict";

/* =========================================================================
   0. 定数
   ========================================================================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const VW = cv.width, VH = cv.height;          // 480 x 270

// ---- ワールド（真上から見たときの座標。x=ゴール間, y=タッチライン間, z=高さ）----
const FW = 600, FH = 320;                     // ピッチの広さ
const CX = FW / 2, CY = FH / 2;
const GOAL_HW = 46;                           // ゴール幅の半分
const GOAL_D  = 26;                           // ゴールの奥行き
const GY0 = CY - GOAL_HW, GY1 = CY + GOAL_HW;

// ---- 左斜め上から見下ろすオブリーク投影 ----
const SKEW = 0.18;    // 奥の列ほど右へずれる量 = 左から見ている度合い
const SQUASH = 0.68;  // 奥行きの圧縮
const ZS = 0.92;      // 高さの見え方
const ZOOM = 1.2;     // 拡大率

const COL = {
  grass:'#2f7d3f', grassDark:'#276b36', grassLight:'#37894a',
  line:'#eef3ee', out:'#1b3a24',
  A:'#4da3ff', Adark:'#1f5f9e', Agk:'#ffd54d',
  B:'#ff5d5d', Bdark:'#a32f2f', Bgk:'#b48cff',
  skin:'#f2c8a0', hair:'#33231a', short:'#f2f4f7',
  ball:'#f7f7f2', ink:'#0d1a12',
  ui:'#e8eaed', accent:'#5eead4', warn:'#ffd54d',
};

const ROLES = ['gk','fwdTop','fwdBottom'];
const ROLE_JP = { gk:'キーパー', fwdTop:'フォワード上', fwdBottom:'フォワード下' };
const ROLE_SHORT = { gk:'GK', fwdTop:'FW1', fwdBottom:'FW2' };

// Botの性格。数値はそのままAIの判断基準になる。
const MINDS = {
  serious:    { jp:'真面目',   desc:'普通にパスもシュートも出す',       shootRange:170, shootLane:58, holdMax:1.4, flee:0.5,  push:1.00 },
  passive:    { jp:'消極的',   desc:'ボールをなかなか離さない',         shootRange: 85, shootLane:34, holdMax:3.4, flee:1.0,  push:0.86 },
  aggressive: { jp:'積極的',   desc:'少し遠くてもシュートを狙う',       shootRange:265, shootLane:92, holdMax:2.4, flee:0.15, push:1.16 },
};
const MIND_KEYS = ['serious','passive','aggressive'];

const HANDS = ['rock','scissors','paper'];
const HAND_JP = { rock:'グー', scissors:'チョキ', paper:'パー' };

// ドリブル音: true にすると単発tapではなくループ音を使う
const USE_DRIBBLE_LOOP = false;

/* =========================================================================
   1. 汎用
   ========================================================================= */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const pick  = arr => arr[(Math.random()*arr.length)|0];
function norm(x,y){ const l = Math.hypot(x,y); return l < 1e-6 ? {x:0,y:0} : {x:x/l,y:y/l}; }
function d2(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

/* =========================================================================
   2. サウンド
   ========================================================================= */
const Snd = {
  ctx:null, master:null, bgmG:null, seG:null, buf:{}, ready:false,
  cur:null, curName:null, loops:{}, vol:0.7, muted:false,

  async boot(){
    if (this.ctx) { await this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = this.vol;
    this.bgmG = this.ctx.createGain(); this.bgmG.gain.value = 0.62;
    this.seG  = this.ctx.createGain(); this.seG.gain.value  = 1.0;
    this.bgmG.connect(this.master); this.seG.connect(this.master);
    this.master.connect(this.ctx.destination);
    await this.decodeAll();
    this.ready = true;
  },

  async decodeAll(){
    const src = window.GAME_AUDIO || {};
    await Promise.all(Object.keys(src).map(async k => {
      const bin = atob(src[k]);
      const u8 = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
      try { this.buf[k] = await this.ctx.decodeAudioData(u8.buffer); }
      catch(e){ console.warn('decode failed', k, e); }
    }));
  },

  se(name, opt){
    if (!this.ready || this.muted || !this.buf[name]) return;
    opt = opt || {};
    const s = this.ctx.createBufferSource();
    s.buffer = this.buf[name];
    s.playbackRate.value = opt.rate || 1;
    const g = this.ctx.createGain();
    g.gain.value = (opt.vol == null ? 1 : opt.vol);
    s.connect(g); g.connect(this.seG); s.start();
  },

  loopOn(name, vol){
    if (!this.ready || this.muted || this.loops[name] || !this.buf[name]) return;
    const s = this.ctx.createBufferSource();
    s.buffer = this.buf[name]; s.loop = true;
    const g = this.ctx.createGain(); g.gain.value = vol == null ? 1 : vol;
    s.connect(g); g.connect(this.seG); s.start();
    this.loops[name] = { s, g };
  },
  loopOff(name){
    const l = this.loops[name];
    if (!l) return;
    try { l.s.stop(); } catch(e){}
    delete this.loops[name];
  },

  bgm(name){
    if (!this.ready || this.curName === name) return;
    this.stopBgm();
    if (!name || !this.buf[name]) { this.curName = name; return; }
    const s = this.ctx.createBufferSource();
    s.buffer = this.buf[name]; s.loop = true;      // 各曲は小節ぴったりなのでそのままループ
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(1, this.ctx.currentTime + 0.35);
    s.connect(g); g.connect(this.bgmG); s.start();
    this.cur = { s, g }; this.curName = name;
  },
  stopBgm(){
    if (this.cur){
      const {s,g} = this.cur, t = this.ctx.currentTime;
      try {
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(Math.max(g.gain.value,0.0001), t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        s.stop(t + 0.3);
      } catch(e){}
    }
    this.cur = null; this.curName = null;
  },

  setVol(v){
    this.vol = v;
    if (this.master) this.master.gain.value = this.muted ? 0 : v;
  },
  setMuted(m){
    this.muted = m;
    if (m) for (const k in this.loops) this.loopOff(k);
    if (this.master) this.master.gain.value = m ? 0 : this.vol;
  },
};

/* =========================================================================
   3. 入力
   ========================================================================= */
const Key = {
  down: new Set(),
  pressed: new Set(),      // このフレームで押された
  press(code){ if (!this.down.has(code)) this.pressed.add(code); this.down.add(code); },
  release(code){ this.down.delete(code); },
  hit(code){ return this.pressed.has(code); },
  endFrame(){ this.pressed.clear(); },
};
const WATCHED = new Set(['KeyW','KeyA','KeyS','KeyD','KeyO','KeyP','Space','Enter','Escape',
  'Digit1','Digit2','Digit3','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);

addEventListener('keydown', e => {
  if (document.activeElement === roomInput) return;
  if (WATCHED.has(e.code)) e.preventDefault();
  Key.press(e.code);
}, { passive:false });
addEventListener('keyup', e => Key.release(e.code));
addEventListener('blur', () => Key.down.clear());

function moveVec(){
  let x = 0, y = 0;
  if (Key.down.has('KeyA') || Key.down.has('ArrowLeft'))  x -= 1;
  if (Key.down.has('KeyD') || Key.down.has('ArrowRight')) x += 1;
  if (Key.down.has('KeyW') || Key.down.has('ArrowUp'))    y -= 1;
  if (Key.down.has('KeyS') || Key.down.has('ArrowDown'))  y += 1;
  return norm(x,y);
}

if ('ontouchstart' in window) document.body.classList.add('touch');
document.querySelectorAll('.dbtn').forEach(b => {
  const code = b.dataset.k;
  const on = e => { e.preventDefault(); Key.press(code); };
  const off = e => { e.preventDefault(); Key.release(code); };
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
});
function tapBtn(id, code){
  const b = document.getElementById(id);
  const go = e => { e.preventDefault(); Key.press(code); setTimeout(()=>Key.release(code), 60); };
  b.addEventListener('touchstart', go, {passive:false});
  b.addEventListener('click', go);
}
tapBtn('tShoot','KeyO'); tapBtn('tPass','KeyP');

// キャンバスクリック→座標をゲームに渡す（メニュー選択用）
let clickPt = null;
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  clickPt = { x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH };
});

/* =========================================================================
   4. 投影とカメラ（元の斜め見下ろしオブリーク投影。x=左右, y=上下 の向きは変えない）
   ========================================================================= */
const cam = { x: CX, y: CY*SQUASH, tx: CX, ty: CY*SQUASH };

function projX(x,y){ return x + (FH - y) * SKEW; }
function projY(y,z){ return y * SQUASH - (z||0) * ZS; }

/** ワールド座標 → 画面座標。戻り値 [sx, sy, scale]（3番目は既存の分割代入では無視される）*/
function S(x, y, z){
  return [ (projX(x,y) - cam.x) * ZOOM + VW/2,
           (projY(y,z) - cam.y) * ZOOM + VH/2,
           ZOOM ];
}
function camClamp(){
  const hw = VW/(2*ZOOM), hh = VH/(2*ZOOM);
  const pxMin = projX(-GOAL_D, FH) - 16, pxMax = projX(FW+GOAL_D, 0) + 16;
  const pyMin = projY(-46,0) - 6,        pyMax = projY(FH+34,0) + 6;
  cam.x = clamp(cam.x, Math.min(pxMin+hw, (pxMin+pxMax)/2), Math.max(pxMax-hw, (pxMin+pxMax)/2));
  cam.y = clamp(cam.y, Math.min(pyMin+hh, (pyMin+pyMax)/2), Math.max(pyMax-hh, (pyMin+pyMax)/2));
}
function camFollow(dt, tx, ty, snap){
  cam.tx = projX(tx, ty); cam.ty = projY(ty, 0);
  const k = snap ? 1 : 1 - Math.pow(0.0016, dt);
  cam.x = lerp(cam.x, cam.tx, k);
  cam.y = lerp(cam.y, cam.ty, k);
  camClamp();
}

/* =========================================================================
   5. 文字描画（2Dゲーム風）
   ========================================================================= */
function setFont(px, kind){
  ctx.font = (kind === 'px')
    ? `${px}px "Press Start 2P", monospace`
    : `${px}px "DotGothic16", "Hiragino Sans", monospace`;
}
function txt(s, x, y, o){
  o = o || {};
  setFont(o.size || 12, o.kind || 'jp');
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  if (o.outline !== false){
    ctx.fillStyle = o.outline || '#08120c';
    const w = o.ow || 2;
    for (let dx=-w; dx<=w; dx++) for (let dy=-w; dy<=w; dy++){
      if (dx || dy) ctx.fillText(s, x+dx, y+dy);
    }
  }
  ctx.fillStyle = o.color || COL.ui;
  ctx.fillText(s, x, y);
}
function panel(x,y,w,h,o){
  o = o || {};
  ctx.fillStyle = o.fill || 'rgba(8,16,12,.82)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = o.stroke || 'rgba(255,255,255,.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  if (o.inner !== false){
    ctx.strokeStyle = o.stroke2 || 'rgba(255,255,255,.18)';
    ctx.strokeRect(x+2.5,y+2.5,w-5,h-5);
  }
}

/* =========================================================================
   6. ワールド（選手・ボール）
   ========================================================================= */

// ---- ドット絵スプライト（game.html と同じ human1/2/3 を流用）----
const CHAR_FOLDERS = ['human1', 'human2', 'human3'];
const POSE_FILES = {
  idle: '01_待機.png',
  dribble1: '02_ドリブル1.png',
  dribble2: '03_ドリブル2.png',
  dribble3: '04_ドリブル3.png',
  passPrep: '05_パス_準備.png',
  passExec: '06_パス_実行.png',
  shootPrep: '07_シュート_準備.png',
  shootExec: '08_シュート_実行.png',
  dash: '09_ダッシュ.png',
  jump: '10_ジャンプ.png',
};
const SPRITE_BASE_HEIGHT = 22; // カメラ scale=1 のときの基準の高さ(px)

// 赤系ユニフォームの色相だけを狙って青(チームA用)に置き換える
function recolorRedToBlue(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0);
  const data = cx.getImageData(0, 0, c.width, c.height);
  const px = data.data;
  for (let i = 0; i < px.length; i += 4) {
    const a = px[i + 3];
    if (a === 0) continue;
    const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const l = (max + min) / 2;
    const d = max - min;
    if (d < 0.05) continue;
    let h;
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
    const s = d / (1 - Math.abs(2 * l - 1));
    const isRedHue = (h < 20 || h > 340);
    if (!isRedHue || s < 0.3) continue;
    const targetH = 212;
    const hh = targetH / 60;
    const cc = (1 - Math.abs(2 * l - 1)) * s;
    const x = cc * (1 - Math.abs((hh % 2) - 1));
    const m = l - cc / 2;
    let rr, gg, bb;
    if (hh < 1) { rr = cc; gg = x; bb = 0; }
    else if (hh < 2) { rr = x; gg = cc; bb = 0; }
    else if (hh < 3) { rr = 0; gg = cc; bb = x; }
    else if (hh < 4) { rr = 0; gg = x; bb = cc; }
    else if (hh < 5) { rr = x; gg = 0; bb = cc; }
    else { rr = cc; gg = 0; bb = x; }
    px[i] = Math.round((rr + m) * 255);
    px[i + 1] = Math.round((gg + m) * 255);
    px[i + 2] = Math.round((bb + m) * 255);
  }
  cx.putImageData(data, 0, 0);
  return c;
}

const spriteSets = { red: [], blue: [] };
CHAR_FOLDERS.forEach((folder, idx) => {

function updatePlayerAnim(p, dt){
  const st = p.anim;
  if (p.down > 0){ st.pose = null; return; } // 転倒中はプリミティブ描画にフォールバック
  if (p.action){
    p.action.t += dt;
    const a = p.action;
    if (a.type === 'shoot'){
      if (a.t < 0.10) st.pose = 'shootPrep';
      else if (a.t < 0.28) st.pose = 'shootExec';
      else { p.action = null; }
    } else if (a.type === 'pass'){
      if (a.t < 0.08) st.pose = 'passPrep';
      else if (a.t < 0.20) st.pose = 'passExec';
      else { p.action = null; }
    }
    if (p.action) return;
  }
  if (Math.abs(p.face.x) > 0.15) st.flip = p.face.x < 0;
  const dx = p.x - st.prevX, dy = p.y - st.prevY;
  st.prevX = p.x; st.prevY = p.y;
  const speed = dt > 0 ? Math.hypot(dx, dy) / dt : 0;
  if (speed > 4){
    if (hasBall(p)){
      st.cycleTimer += dt;
      const idx = Math.floor(st.cycleTimer * 8) % 3;
      st.pose = ['dribble1', 'dribble2', 'dribble3'][idx];
    } else {
      st.pose = 'dash';
    }
  } else {
    st.pose = 'idle';
    st.cycleTimer = 0;
  }
}

function mkPlayer(team, role){
  return {
    team, role,
    x:0, y:0, vx:0, vy:0,
    face:{x: team==='A'?1:-1, y:0},
    r: role==='gk' ? 10 : 9,
    speed: role==='gk' ? 70 : 88,
    human:false, humanTag:null,      // 'you' | 'friend'(オンラインの相方)
    mind:'serious',
    hold:0,                          // ボール保持時間
    down:0,                          // >0 なら吹き飛ばされて転倒中
    spin:0, kx:0, ky:0,              // ノックバック
    stepPhase:0,
    charIndex: ROLES.indexOf(role),
    action: null,
    anim: { pose:'idle', cycleTimer:0, flip: team !== 'A', prevX:0, prevY:0 },
  };
}
const teamA = ROLES.map(r => mkPlayer('A', r));
const teamB = ROLES.map(r => mkPlayer('B', r));
const players = teamA.concat(teamB);
const teamOf = t => t === 'A' ? teamA : teamB;
const byRole = (t, r) => teamOf(t).find(p => p.role === r);

const ball = { x:CX, y:CY, z:0, vx:0, vy:0, vz:0, r:4, carrier:null, cool:0, spin:0, touch:0 };

const M = {
  half:1, timeLeft:60, halfLen:60,
  scoreA:0, scoreB:0,
  state:'playing',              // playing | goal | halftime | fulltime
  pause:0, dirA:1,              // dirA=+1 → Aチームは +x 方向へ攻める
  msg:'', lastScorer:null,
  battleCool:0,
};

function goalXFor(team){ const d = team==='A' ? M.dirA : -M.dirA; return d > 0 ? FW : 0; }
function ownGoalX(team){ const d = team==='A' ? M.dirA : -M.dirA; return d > 0 ? 0 : FW; }

/** 逆三角形フォーメーション（GK1 + FW2）の定位置 */
function slot(p){
  const d = p.team === 'A' ? M.dirA : -M.dirA;
  const gx = d > 0 ? 0 : FW;                       // 自陣ゴール側
  if (p.role === 'gk')        return { x: gx + d*44,  y: CY };
  if (p.role === 'fwdTop')    return { x: CX + d*46, y: CY + 74 };
  return                             { x: CX + d*46, y: CY - 74 };
}

function kickoff(who){
  ball.x = CX; ball.y = CY; ball.z = 0;
  ball.vx = ball.vy = ball.vz = 0; ball.carrier = null; ball.cool = 0.5;
  for (const p of players){
    const s = slot(p);
    // キックオフ側は少し前に出す
    const d = p.team === 'A' ? M.dirA : -M.dirA;
    const adv = (who && who === p.team && p.role !== 'gk') ? 26*d : 0;
    p.x = clamp(s.x + adv, 14, FW-14); p.y = s.y;
    p.vx = p.vy = 0; p.hold = 0; p.down = 0; p.kx = p.ky = 0; p.spin = 0;
    p.face = { x: d, y: 0 };
  }
  camFollow(0, ball.x, ball.y, true);
}

/* =========================================================================
   7. アクション
   ========================================================================= */
function hasBall(p){ return ball.carrier === p; }

function releaseBall(cool){
  const p = ball.carrier;
  ball.carrier = null; ball.cool = cool;
  if (p) p.hold = 0;
}

/** Botが狙うコース: 相手GKがいない側のポスト際 */
function shootTarget(p){
  const gx = goalXFor(p.team);
  const gk = byRole(p.team === 'A' ? 'B' : 'A', 'gk');
  const side = (gk && gk.y > CY) ? -1 : 1;
  return { x: gx, y: CY + side*(GOAL_HW-14) };
}

function doShoot(p){
  if (!p || !hasBall(p) || p.down > 0 || M.battleCool > 0) return;
  const gx = goalXFor(p.team);
  let dir;
  if (p.humanTag){
    // プレイヤーは向いている方向優先。少しだけゴールへ寄せて当てやすく。
    const t = { x: gx, y: clamp(p.y, GY0+12, GY1-12) };
    const g = norm(t.x-p.x, t.y-p.y);
    dir = norm(p.face.x*0.76 + g.x*0.24, p.face.y*0.76 + g.y*0.24);
  } else {
    const t = shootTarget(p);
    const v = norm(t.x-p.x, t.y-p.y);
    const err = clamp(Math.abs(gx-p.x)/1100, 0, 0.15) * (Math.random()*2-1);
    const a = Math.atan2(v.y, v.x) + err;
    dir = { x: Math.cos(a), y: Math.sin(a) };
  }
  const pw = 320;
  ball.vx = dir.x*pw; ball.vy = dir.y*pw*0.92; ball.vz = 48; ball.spin = 9;
  releaseBall(0.30);
  Snd.se('se_ball_kick', { vol:1.0 });
  p.action = { type:'shoot', t:0 };
}

function doPass(p){
  if (!p || !hasBall(p) || p.down > 0) return;
  const mates = teamOf(p.team).filter(t => t !== p && t.down <= 0);
  let best = null, bs = -Infinity;
  for (const t of mates){
    const v = norm(t.x-p.x, t.y-p.y);
    const align = v.x*p.face.x + v.y*p.face.y;         // -1..1
    const fwd = ((t.x - p.x) * (goalXFor(p.team) > CX ? 1 : -1)) / 200;
    const s = align*1.8 + fwd*1.1 - d2(p,t)/420;
    if (s > bs){ bs = s; best = t; }
  }
  if (!best) return;
  const v = norm(best.x-p.x, best.y-p.y);
  const power = clamp(d2(p,best) * 1.15, 130, 225);
  ball.vx = v.x*power; ball.vy = v.y*power; ball.vz = 16; ball.spin = 5;
  releaseBall(0.22);
  Snd.se('se_ball_kick', { vol:0.62, rate:1.22 });     // パスは軽く高めに
  p.action = { type:'pass', t:0 };
}

function knockDown(p, fromX, fromY){
  const v = norm(p.x - fromX, p.y - fromY);
  p.down = 1.7;
  p.kx = v.x * 260; p.ky = v.y * 260;
  p.spin = 0;
  if (hasBall(p)) releaseBall(0.3);
  spawnWind(p.x, p.y, v);
}

/* =========================================================================
   8. 風のエフェクト
   ========================================================================= */
const winds = [];
function spawnWind(x, y, dir){
  for (let i=0;i<26;i++){
    const a = Math.atan2(dir.y, dir.x) + rnd(-0.85, 0.85);
    const sp = rnd(90, 300);
    winds.push({ x, y, z: rnd(0,26), vx: Math.cos(a)*sp, vy: Math.sin(a)*sp*0.7,
                 life: rnd(0.28, 0.75), max: rnd(0.28, 0.75), len: rnd(5,16) });
  }
}
function updateWinds(dt){
  for (let i=winds.length-1;i>=0;i--){
    const w = winds[i];
    w.x += w.vx*dt; w.y += w.vy*dt; w.vx *= 0.94; w.vy *= 0.94;
    w.life -= dt;
    if (w.life <= 0) winds.splice(i,1);
  }
}
function drawWinds(){
  ctx.lineCap = 'round';
  for (const w of winds){
    const t = clamp(w.life / w.max, 0, 1);
    const [sx, sy] = S(w.x, w.y, w.z);
    const [ex, ey] = S(w.x - w.vx*0.035, w.y - w.vy*0.035, w.z);
    ctx.strokeStyle = `rgba(226,246,255,${0.10 + 0.55*t})`;
    ctx.lineWidth = t > 0.55 ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
  }
  ctx.lineWidth = 1;
}

/* =========================================================================
   9. じゃんけんコマンドバトル
   ========================================================================= */
const B = {
  on:false, a:null, b:null, handA:null, handB:null,
  phase:'pick', t:0, round:1, result:'', botTimerA:0, botTimerB:0, interactive:false,
};

function beatsHand(h1, h2){                    // 1が勝ちなら1 / 負けなら-1 / あいこ0
  if (h1 === h2) return 0;
  if ((h1==='rock'&&h2==='scissors')||(h1==='scissors'&&h2==='paper')||(h1==='paper'&&h2==='rock')) return 1;
  return -1;
}
function myPlayer(){ return players.find(p => p.humanTag === 'you') || null; }

function startBattle(a, b){
  B.on = true; B.a = a; B.b = b; B.handA = B.handB = null;
  B.phase = 'pick'; B.t = 0; B.round = 1; B.result = '';
  B.interactive = (a.humanTag === 'you' || b.humanTag === 'you');
  const q = B.interactive ? 1 : 0.45;
  B.botTimerA = a.humanTag ? 99 : rnd(0.35, 1.1) * q;
  B.botTimerB = b.humanTag ? 99 : rnd(0.35, 1.1) * q;
  a.vx = a.vy = b.vx = b.vy = 0;
  releaseBall(99);                              // 決着まではボールを浮かせない
  ball.vx = ball.vy = ball.vz = 0;
  ball.x = (a.x+b.x)/2; ball.y = (a.y+b.y)/2; ball.z = 0;
  Snd.loopOff('se_dribble_loop');
}

function resolveBattle(){
  let r = beatsHand(B.handA, B.handB);
  // CPUがあいこ以外で人間に勝った時、たまに引き分けに救済してCPUの体感的な強さを下げる
  const me0 = myPlayer();
  if (r !== 0 && B.interactive && me0){
    const meIsA = B.a.humanTag === 'you';
    const humanWon = meIsA ? r > 0 : r < 0;
    if (!humanWon && Math.random() < 0.3){
      if (meIsA) B.handB = B.handA; else B.handA = B.handB;
      r = 0;
    }
  }
  if (r === 0){
    B.result = 'draw';
    Snd.se('se_ui_click', { vol:0.8, rate:0.9 });
    return;
  }
  const win = r > 0 ? B.a : B.b;
  const lose = r > 0 ? B.b : B.a;
  B.result = (win === B.a) ? 'a' : 'b';
  B.winner = win; B.loser = lose;

  const me = myPlayer();
  const myTeam = me ? me.team : 'A';
  if (win.team === myTeam) Snd.se('se_battle_win',  { vol:0.9 });
  else                     Snd.se('se_battle_lose', { vol:0.9 });
}

function finishBattle(){
  const win = B.winner, lose = B.loser;
  B.on = false;
  M.battleCool = 1.6;                             // 決着直後は少し操作を落ち着かせる（即シュート禁止にも使う）
  if (win && lose){
    knockDown(lose, win.x, win.y);
    Snd.se('se_blow_away', { vol:0.95 });
    ball.carrier = win; win.hold = 0; ball.cool = 0;
  } else {
    ball.cool = 0.35;
  }
  B.winner = B.loser = null;
}

function updateBattle(dt){
  B.t += dt;
  if (B.phase === 'pick'){
    // Botの手
    if (B.handA == null){ B.botTimerA -= dt; if (B.botTimerA <= 0) B.handA = pick(HANDS); }
    if (B.handB == null){ B.botTimerB -= dt; if (B.botTimerB <= 0) B.handB = pick(HANDS); }
    // 人間の手
    if (B.interactive){
      const meIsA = B.a.humanTag === 'you';
      const cur = meIsA ? B.handA : B.handB;
      if (cur == null){
        let h = null;
        if (Key.hit('Digit1')) h = 'rock';
        if (Key.hit('Digit2')) h = 'scissors';
        if (Key.hit('Digit3')) h = 'paper';
        if (clickPt){
          const i = handHitTest(clickPt);
          if (i >= 0) h = HANDS[i];
        }
        if (h){
          if (meIsA) B.handA = h; else B.handB = h;
          Snd.se('se_ui_confirm', { vol:0.7, rate:1.1 });
        }
      }
      if (B.t > 3.4){                                   // 時間切れは自動でランダム
        if (B.handA == null) B.handA = pick(HANDS);
        if (B.handB == null) B.handB = pick(HANDS);
      }
    }
    if (B.handA && B.handB){
      resolveBattle();
      B.phase = 'reveal'; B.t = 0;
    }
  } else if (B.phase === 'reveal'){
    const wait = B.interactive ? 1.9 : 0.55;
    if (B.t > wait){
      if (B.result === 'draw'){
        B.handA = B.handB = null;
        B.round++; B.phase = 'pick'; B.t = 0;
        B.botTimerA = B.a.humanTag ? 99 : rnd(0.3,0.9);
        B.botTimerB = B.b.humanTag ? 99 : rnd(0.3,0.9);
      } else {
        finishBattle();
      }
    }
  }
}

// じゃんけんUIの当たり判定（クリック用）
const HAND_BOX = [];
function handHitTest(pt){
  for (let i=0;i<HAND_BOX.length;i++){
    const b = HAND_BOX[i];
    if (pt.x>=b.x && pt.x<=b.x+b.w && pt.y>=b.y && pt.y<=b.y+b.h) return i;
  }
  return -1;
}

/* =========================================================================
   10. AI
   ========================================================================= */
const BOT_SPEED_MULT = 0.75; // CPU(steerで動く選手)だけ減速。人間操作(updateHuman)には影響しない
function steer(p, tx, ty, dt, scale){
  const dx = tx-p.x, dy = ty-p.y, d = Math.hypot(dx,dy);
  if (d > 2){
    const v = norm(dx,dy);
    const sp = p.speed * BOT_SPEED_MULT * (scale == null ? 1 : scale);
    p.vx = v.x*sp; p.vy = v.y*sp;
    p.face = v;
  } else { p.vx = 0; p.vy = 0; }
}
function nearestOpp(p){
  let best = null, bd = Infinity;
  for (const o of teamOf(p.team==='A'?'B':'A')){
    if (o.down > 0) continue;
    const d = d2(p,o); if (d < bd){ bd = d; best = o; }
  }
  return { p:best, d:bd };
}
function chaserOf(team){
  let best = null, bd = Infinity;
  for (const p of teamOf(team)){
    if (p.role === 'gk' || p.down > 0) continue;
    const d = d2(p, ball); if (d < bd){ bd = d; best = p; }
  }
  return best || teamOf(team)[0];
}

function aiGK(p, dt){
  const gx = ownGoalX(p.team);
  const side = gx > CX ? -1 : 1;                   // ピッチ内向き
  if (hasBall(p)){
    p.hold += dt;
    if (p.hold > 0.75){ doPass(p); }
    else steer(p, gx + side*40, CY, dt, 0.7);
    return;
  }
  const ballNear = Math.abs(ball.x - gx) < 130;
  if (ballNear && !ball.carrier && Math.abs(ball.y-CY) < 90){
    steer(p, ball.x, ball.y, dt, 1.0);             // 飛び出して押さえる
  } else {
    const ty = clamp(CY + (ball.y - CY)*0.42, GY0-4, GY1+4);
    const tx = gx + side * (26 + clamp((130-Math.abs(ball.x-gx))*0.14, 0, 22));
    steer(p, tx, ty, dt, 0.9);
  }
}

// game.html の updateBotAI をそのまま移植（ワールドが大きい分だけ距離のしきい値を FW/FH 比でスケール）
const BOT_CHASE_RANGE = 92;     // game.html: 55 * (FW/360)
const BOT_SHOOT_RANGE = 75;     // game.html: 45 * (FW/360)
const BOT_SHOOT_LANE  = 30;     // game.html: 18 * (FH/200)
const BOT_HOLD_MAX    = 2.2;    // game.html と同じ（時間なのでスケールしない）
const BOT_DEFEND_RANGE = 100;   // game.html: 60 * (FW/360)

function aiField(p, dt){
  const gx = goalXFor(p.team);
  const mates = teamOf(p.team);
  const teamHas = mates.some(hasBall);

  if (hasBall(p)){
    p.hold += dt;
    const distToGoal = Math.abs(gx - p.x);
    const aligned = Math.abs(p.y - CY) < BOT_SHOOT_LANE;
    steer(p, gx, CY, dt, 1.0);
    if (distToGoal < BOT_SHOOT_RANGE && aligned){ doShoot(p); return; }
    if (p.hold > BOT_HOLD_MAX){ doPass(p); return; }
    return;
  }

  // GKに次いで自陣ゴールに近い方が軽く守備につく（kosugeにはdefenderロールが無いのでGK以外の中で判定）
  const og = ownGoalX(p.team);
  if (Math.abs(ball.x - og) < BOT_DEFEND_RANGE){
    steer(p, ball.x, ball.y, dt, 1.0);
    return;
  }

  let chaser = null, bestD = Infinity;
  for (const t of mates){
    if (t.role === 'gk' || t.down > 0) continue;
    const d = d2(t, ball);
    if (d < bestD){ bestD = d; chaser = t; }
  }
  if (chaser && bestD > BOT_CHASE_RANGE) chaser = null;

  if (p === chaser && !teamHas){ steer(p, ball.x, ball.y, dt, 1.0); return; }

  const s = slot(p);
  const tx = clamp(s.x + (ball.x - CX)*0.25, 20, FW-20);
  const ty = clamp(s.y + (ball.y - CY)*0.35, 18, FH-18);
  steer(p, tx, ty, dt, 0.9);
}

function aiPlayer(p, dt){
  if (p.role === 'gk') aiGK(p, dt); else aiField(p, dt);
}

/* =========================================================================
   11. 物理・更新
   ========================================================================= */
let dribbleTimer = 0;

function updateHuman(p, dt, mv, wantShoot, wantPass){
  if (!p || p.down > 0) return;
  if (mv.x || mv.y){
    p.vx = mv.x*p.speed; p.vy = mv.y*p.speed; p.face = mv;
  } else { p.vx = 0; p.vy = 0; }
  if (hasBall(p)) p.hold += dt;
  if (wantShoot) doShoot(p);
  if (wantPass)  doPass(p);
}

function integrate(p, dt){
  if (p.down > 0){
    p.down -= dt;
    p.x += p.kx*dt; p.y += p.ky*dt;
    p.kx *= Math.pow(0.02, dt); p.ky *= Math.pow(0.02, dt);
    p.spin += dt*12;
    if (p.down <= 0){ p.down = 0; p.kx = p.ky = 0; p.spin = 0; }
  } else {
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.vx || p.vy) p.stepPhase += dt * 9;
  }
  p.x = clamp(p.x, 10, FW-10);
  p.y = clamp(p.y, 10, FH-10);
}

function separate(){
  for (let i=0;i<players.length;i++) for (let j=i+1;j<players.length;j++){
    const a = players[i], b = players[j];
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy);
    const md = a.r + b.r + 1;
    if (d > 0.001 && d < md){
      const push = (md-d)/2, n = norm(dx,dy);
      if (a.down <= 0){ a.x -= n.x*push; a.y -= n.y*push; }
      if (b.down <= 0){ b.x += n.x*push; b.y += n.y*push; }
    }
  }
}

function updateBall(dt){
  if (ball.cool > 0 && ball.cool < 90) ball.cool -= dt;

  if (ball.carrier){
    const p = ball.carrier;
    ball.x = p.x + p.face.x*(p.r+4);
    ball.y = p.y + p.face.y*(p.r+4);
    ball.z = 0; ball.vx = ball.vy = ball.vz = 0;
    ball.spin = Math.hypot(p.vx,p.vy)*0.04;

    // ドリブル音（速度に応じた間隔）
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 8 && !B.on){
      if (USE_DRIBBLE_LOOP){ Snd.loopOn('se_dribble_loop', 0.9); }
      else {
        dribbleTimer -= dt;
        if (dribbleTimer <= 0){
          Snd.se('se_dribble_tap', { vol:0.95, rate: rnd(0.94,1.08) });
          dribbleTimer = clamp(26 / sp, 0.17, 0.42);
        }
      }
    } else { Snd.loopOff('se_dribble_loop'); }
    return;
  }
  Snd.loopOff('se_dribble_loop');

  ball.x += ball.vx*dt; ball.y += ball.vy*dt;
  ball.z += ball.vz*dt; ball.vz -= 540*dt;
  ball.spin += Math.hypot(ball.vx,ball.vy)*0.0012;

  if (ball.z <= 0){
    ball.z = 0;
    if (ball.vz < -35){
      ball.vz *= -0.45;
      Snd.se('se_ball_bounce', { vol: clamp(-ball.vz/170,0.16,0.7), rate: rnd(0.94,1.08) });
    } else ball.vz = 0;
    const f = Math.pow(0.52, dt);
    ball.vx *= f; ball.vy *= f;
  } else {
    const f = Math.pow(0.80, dt);
    ball.vx *= f; ball.vy *= f;
  }

  // タッチライン
  if (ball.y < ball.r){ ball.y = ball.r; ball.vy *= -0.62; Snd.se('se_ball_bounce',{vol:0.28,rate:1.15}); }
  if (ball.y > FH-ball.r){ ball.y = FH-ball.r; ball.vy *= -0.62; Snd.se('se_ball_bounce',{vol:0.28,rate:1.15}); }

  const inMouth = ball.y > GY0 && ball.y < GY1;
  if (!inMouth){
    if (ball.x < ball.r){ ball.x = ball.r; ball.vx *= -0.62; Snd.se('se_ball_bounce',{vol:0.3,rate:1.05}); }
    if (ball.x > FW-ball.r){ ball.x = FW-ball.r; ball.vx *= -0.62; Snd.se('se_ball_bounce',{vol:0.3,rate:1.05}); }
  } else {
    // ゴール内の壁
    if (ball.x < -GOAL_D+ball.r){ ball.x = -GOAL_D+ball.r; ball.vx *= -0.3; }
    if (ball.x > FW+GOAL_D-ball.r){ ball.x = FW+GOAL_D-ball.r; ball.vx *= -0.3; }
  }

  // 保持判定
  if (ball.cool <= 0 && ball.z < 16){
    let best = null, bd = Infinity;
    for (const p of players){
      if (p.down > 0) continue;
      const d = d2(p, ball);
      if (d < p.r + ball.r + 4 && d < bd){ bd = d; best = p; }
    }
    if (best){
      ball.carrier = best; best.hold = 0; ball.cool = 0;
      const strong = best.role === 'gk';
      Snd.se('se_ball_catch', { vol: strong ? 1.0 : 0.55, rate: strong ? 0.95 : 1.1 });
    }
  }
}

function checkGoal(){
  if (M.state !== 'playing') return;
  const inMouth = ball.y > GY0 && ball.y < GY1;
  if (!inMouth) return;
  if (ball.z > 40) return;                       // クロスバーの上は無効
  let scorer = null;
  if (ball.x < 0) scorer = (M.dirA > 0) ? 'B' : 'A';
  else if (ball.x > FW) scorer = (M.dirA > 0) ? 'A' : 'B';
  if (!scorer) return;
  if (scorer === 'A') M.scoreA++; else M.scoreB++;
  M.state = 'goal'; M.pause = 2.0; M.lastScorer = scorer;
  Snd.se('se_goal_net', { vol:1.0 });
  spawnWind(ball.x, ball.y, { x: ball.x < CX ? 1 : -1, y:0 });
}

function checkBattle(){
  if (M.battleCool > 0 || B.on || !ball.carrier) return;
  const c = ball.carrier;
  if (c.down > 0) return;
  for (const o of teamOf(c.team==='A'?'B':'A')){
    if (o.down > 0) continue;
    if (d2(c,o) < c.r + o.r + 5){ startBattle(c, o); return; }
  }
}

function updateMatch(dt){
  if (M.battleCool > 0) M.battleCool -= dt;

  if (B.on){ updateBattle(dt); camFollow(dt, ball.x, ball.y); updateWinds(dt); return; }

  if (M.state === 'goal'){
    M.pause -= dt; updateWinds(dt); camFollow(dt, ball.x, ball.y);
    if (M.pause <= 0){ kickoff(M.lastScorer === 'A' ? 'B' : 'A'); M.state = 'playing'; }
    return;
  }
  if (M.state === 'halftime'){
    M.pause -= dt;
    if (M.pause <= 0){
      M.half = 2; M.timeLeft = M.halfLen; M.dirA *= -1;
      kickoff('B'); M.state = 'playing';
    }
    return;
  }
  if (M.state === 'fulltime'){
    M.pause -= dt;
    if (M.pause <= 0) gotoScene('result');
    return;
  }

  M.timeLeft -= dt;
  if (M.timeLeft <= 0){
    M.timeLeft = 0;
    Snd.loopOff('se_dribble_loop');
    if (M.half === 1){ M.state = 'halftime'; M.pause = 2.2; Snd.se('se_ui_confirm',{vol:0.7,rate:0.8}); }
    else { M.state = 'fulltime'; M.pause = 1.6; }
    return;
  }

  // --- 入力 ---
  const me = myPlayer();
  updateHuman(me, dt, moveVec(), Key.hit('KeyO'), Key.hit('KeyP'));
  if (Net.role === 'host' && Net.guestOn){
    const fp = players.find(p => p.humanTag === 'friend');
    updateHuman(fp, dt, Net.guestMv, Net.guestShoot, Net.guestPass);
    Net.guestShoot = Net.guestPass = false;
  }

  for (const p of players) if (!p.humanTag && p.down <= 0) aiPlayer(p, dt);
  for (const p of players) integrate(p, dt);
  separate();
  updateBall(dt);
  checkBattle();
  checkGoal();
  updateWinds(dt);
  camFollow(dt, ball.x, ball.y);
}

let tclock = 0;

function skyGradient(top, bottom){
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);
}
function stars(n, seed, ybase){
  for (let i=0;i<n;i++){
    const x = ((i*7919 + seed*131) % 977) / 977 * VW;
    const y = ((i*6271 + seed*57) % 613) / 613 * ybase;
    const tw = 0.55 + 0.45*Math.sin(tclock*2 + i);
    ctx.fillStyle = `rgba(220,235,255,${0.25+0.45*tw})`;
    ctx.fillRect(x|0, y|0, 1, 1);
  }
}
function stands(y0, h, rows, seed){
  ctx.fillStyle = '#141b26'; ctx.fillRect(0, y0, VW, h);
  for (let r=0;r<rows;r++){
    const yy = y0 + 3 + r*(h-4)/rows;
    for (let x=-4;x<VW+4;x+=5){
      const k = ((x*13 + r*31 + seed*7) % 97);
      if (k < 62){
        const pal = ['#2f4258','#3a4f68','#4b3a58','#573a3a','#2b5344'];
        ctx.fillStyle = pal[k % pal.length];
        const bob = ((Math.sin(tclock*3 + x*0.3 + r) > 0.86) ? -1 : 0);
        ctx.fillRect(x + (r%2?2:0), yy + bob, 3, 3);
      }
    }
  }
  ctx.fillStyle = '#0d131c'; ctx.fillRect(0, y0+h-3, VW, 3);
}
function floodlight(x, y){
  const g = ctx.createRadialGradient(x, y, 2, x, y, 46);
  g.addColorStop(0,'rgba(255,248,214,.55)'); g.addColorStop(1,'rgba(255,248,214,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,46,0,7); ctx.fill();
  ctx.fillStyle = '#2a3342'; ctx.fillRect(x-1, y, 2, 40);
  ctx.fillStyle = '#fff6cf'; ctx.fillRect(x-9, y-6, 18, 7);
  ctx.fillStyle = '#c9bd8a'; ctx.fillRect(x-9, y+1, 18, 2);
}

   13. ピッチと選手の描画

function poly(pts, fill, stroke){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function line(a, b, color, w){
  ctx.strokeStyle = color || COL.line; ctx.lineWidth = w || 1;
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  ctx.lineWidth = 1;
}
function ellipseWorld(cx, cy, r, color){
  const pts = [];
  for (let i=0;i<=24;i++){
    const a = i/24*Math.PI*2;
    pts.push(S(cx + Math.cos(a)*r, cy + Math.sin(a)*r, 0));
  }
  poly(pts, null, color || COL.line);
}

function drawStadium(){
  // 場外の地面
  ctx.fillStyle = COL.out; ctx.fillRect(0,0,VW,VH);
  // 奥の観客席（y<0 側）
  const t0 = S(-90, -120, 0), t1 = S(FW+90, -120, 0), t2 = S(FW+90, -34, 0), t3 = S(-90, -34, 0);
  poly([t0,t1,t2,t3], '#141b26');
  for (let r=0;r<5;r++){
    for (let x=-80; x<FW+80; x+=13){
      const k = ((x*7 + r*29) % 101);
      if (k < 66){
        const pal = ['#2f4258','#3a4f68','#4b3a58','#573a3a','#2b5344'];
        ctx.fillStyle = pal[k % pal.length];
        const [sx, sy] = S(x, -110 + r*15, 0);
        const bob = (Math.sin(tclock*3 + x*0.2 + r) > 0.9) ? -1 : 0;
        ctx.fillRect(sx|0, (sy|0)+bob, 3, 3);
      }
    }
  }
  // 看板
  const b0 = S(-70,-34,0), b1 = S(FW+70,-34,0), b2 = S(FW+70,-18,0), b3 = S(-70,-18,0);
  poly([b0,b1,b2,b3], '#0f1620', 'rgba(255,255,255,.18)');
  for (let x=-60; x<FW+60; x+=64){
    const [sx, sy] = S(x, -30, 0);
    txt('3vs3', sx+18, sy+5, { size:7, kind:'px', color:'rgba(94,234,212,.75)', outline:false });
  }
  // 手前の看板
  const f0 = S(-70,FH+14,0), f1 = S(FW+70,FH+14,0), f2 = S(FW+70,FH+30,0), f3 = S(-70,FH+30,0);
  poly([f0,f1,f2,f3], '#0f1620', 'rgba(255,255,255,.14)');
}

function drawPitch(){
  const c0 = S(0,0,0), c1 = S(FW,0,0), c2 = S(FW,FH,0), c3 = S(0,FH,0);
  poly([c0,c1,c2,c3], COL.grass);
  // 芝のストライプ（x方向）
  const N = 10;
  for (let i=0;i<N;i++){
    if (i % 2) continue;
    const x0 = i*FW/N, x1 = (i+1)*FW/N;
    poly([S(x0,0,0), S(x1,0,0), S(x1,FH,0), S(x0,FH,0)], COL.grassDark);
  }
  // 外枠
  poly([c0,c1,c2,c3], null, COL.line);
  // センターライン・サークル
  line(S(CX,0,0), S(CX,FH,0));
  ellipseWorld(CX, CY, 52);
  ctx.fillStyle = COL.line; const cp = S(CX,CY,0); ctx.fillRect(cp[0]-1, cp[1]-1, 2, 2);
  // ペナルティエリア
  for (const sgn of [0,1]){
    const gx = sgn ? FW : 0, d = sgn ? -1 : 1;
    poly([S(gx,GY0-34,0), S(gx+d*72,GY0-34,0), S(gx+d*72,GY1+34,0), S(gx,GY1+34,0)], null, COL.line);
    poly([S(gx,GY0-10,0), S(gx+d*26,GY0-10,0), S(gx+d*26,GY1+10,0), S(gx,GY1+10,0)], null, COL.line);

}

function drawGoal(side){
  const gx = side === 'L' ? 0 : FW;
  const d  = side === 'L' ? -1 : 1;
  const bx = gx + d*GOAL_D;
  const H = 40;
  // ネット面（背面）
  const n0 = S(bx,GY0,H), n1 = S(bx,GY1,H), n2 = S(bx,GY1,0), n3 = S(bx,GY0,0);
  poly([n0,n1,n2,n3], 'rgba(226,236,246,.16)', 'rgba(226,236,246,.55)');
  // 網目
  ctx.strokeStyle = 'rgba(226,236,246,.28)';
  for (let i=1;i<7;i++){
    const yy = GY0 + (GY1-GY0)*i/7;
    line(S(bx,yy,H), S(bx,yy,0), 'rgba(226,236,246,.24)');
  }
  for (let i=1;i<4;i++){
    const zz = H*i/4;
    line(S(bx,GY0,zz), S(bx,GY1,zz), 'rgba(226,236,246,.24)');
  }
  // 側面
  poly([S(gx,GY0,H), S(bx,GY0,H), S(bx,GY0,0), S(gx,GY0,0)], 'rgba(226,236,246,.10)', 'rgba(226,236,246,.35)');
  poly([S(gx,GY1,H), S(bx,GY1,H), S(bx,GY1,0), S(gx,GY1,0)], 'rgba(226,236,246,.10)', 'rgba(226,236,246,.35)');
  // ゴールポスト（手前の枠）
  ctx.strokeStyle = '#f4f7fa'; ctx.lineWidth = 2;
  ctx.beginPath();
  let p = S(gx,GY0,0); ctx.moveTo(p[0],p[1]);
  p = S(gx,GY0,H); ctx.lineTo(p[0],p[1]);
  p = S(gx,GY1,H); ctx.lineTo(p[0],p[1]);
  p = S(gx,GY1,0); ctx.lineTo(p[0],p[1]);
  ctx.stroke(); ctx.lineWidth = 1;
}

function shadow(x,y,rx,ry,a){
  const [sx,sy,sc] = S(x,y,0);
  ctx.fillStyle = `rgba(0,0,0,${a == null ? .32 : a})`;
  ctx.beginPath(); ctx.ellipse(sx, sy, rx*sc, ry*sc, 0, 0, Math.PI*2); ctx.fill();
}

function drawPlayerSprite(p, sx, sy, sc){
  const set = p.team === 'A' ? spriteSets.blue : spriteSets.red;
  const poses = set[p.charIndex];
  const img = poses && poses[p.anim.pose];
  if (!img || !(img instanceof HTMLCanvasElement || img.complete)) return false;
  const dh = SPRITE_BASE_HEIGHT * sc;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const dw = dh * (iw / ih);
  const top = sy - dh;
  ctx.save();
  if (p.anim.flip){
    ctx.translate(sx, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(img, Math.round(-dw / 2), Math.round(top), Math.round(dw), Math.round(dh));
  } else {
    ctx.drawImage(img, Math.round(sx - dw / 2), Math.round(top), Math.round(dw), Math.round(dh));
  }
  ctx.restore();
  return true;
}

function drawPlayer(p){
  shadow(p.x, p.y, p.r*0.95, p.r*0.42, p.down>0 ? 0.22 : 0.34);
  const [sx, sy, sc] = S(p.x, p.y, 0);
  const s = sc;

  if (p.down <= 0 && drawPlayerSprite(p, sx, sy, sc)){
    if (p.humanTag){
      const c = p.humanTag === 'you' ? COL.warn : '#4dffb8';
      const yy = sy - SPRITE_BASE_HEIGHT*sc - 4 + Math.sin(tclock*5)*1.6;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(sx-4, yy); ctx.lineTo(sx+4, yy); ctx.lineTo(sx, yy+5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
    }
    if (p.role === 'gk'){
      txt('GK', sx, sy - SPRITE_BASE_HEIGHT*sc - (p.humanTag ? 10 : 2), { size:6, kind:'px', color:'#ffe9a8', ow:1 });
    }
    return;
  }

  const isGK = p.role === 'gk';
  const shirt = isGK ? (p.team==='A'?COL.Agk:COL.Bgk) : (p.team==='A'?COL.A:COL.B);
  const dark  = isGK ? '#8a6a12' : (p.team==='A'?COL.Adark:COL.Bdark);

  ctx.save();
  ctx.translate(sx, sy);
  if (p.down > 0){ ctx.rotate(clamp(p.spin, 0, 1.35)); ctx.translate(0, 3*s); }

  const bob = (p.down>0) ? 0 : Math.sin(p.stepPhase)* (Math.hypot(p.vx,p.vy)>4 ? 1 : 0);
  const W = 9*s, HH = 20*s;

  // 脚
  ctx.fillStyle = '#e8e6df';
  const legSwing = (p.down>0) ? 0 : Math.sin(p.stepPhase)*2.4*s;
  ctx.fillRect(-3.2*s + legSwing*0.5, -5*s, 2.6*s, 5*s);
  ctx.fillRect( 0.6*s - legSwing*0.5, -5*s, 2.6*s, 5*s);
  ctx.fillStyle = COL.ink;
  ctx.fillRect(-3.4*s + legSwing*0.5, -1.6*s, 3.0*s, 1.6*s);
  ctx.fillRect( 0.4*s - legSwing*0.5, -1.6*s, 3.0*s, 1.6*s);

  // 胴
  ctx.fillStyle = shirt;
  ctx.fillRect(-W/2, -13*s + bob*0.4, W, 8*s);
  ctx.fillStyle = dark;
  ctx.fillRect(-W/2, -6.2*s + bob*0.4, W, 1.6*s);
  // 腕
  ctx.fillStyle = shirt;
  ctx.fillRect(-W/2-2*s, -12.4*s + bob*0.4, 2*s, 5.5*s);
  ctx.fillRect( W/2,     -12.4*s + bob*0.4, 2*s, 5.5*s);

  // 頭
  const hy = -20*s + bob*0.6;
  ctx.fillStyle = COL.skin; ctx.fillRect(-3.4*s, hy, 6.8*s, 7*s);
  ctx.fillStyle = COL.hair; ctx.fillRect(-3.8*s, hy-1.2*s, 7.6*s, 3*s);
  // 目（向きで位置が変わる）
  ctx.fillStyle = COL.ink;
  const ex = clamp(p.face.x, -1, 1) * 1.5*s;
  if (p.face.y > 0.6){
    ctx.fillRect(-2.2*s+ex, hy+3.2*s, 1.3*s, 1.5*s);
    ctx.fillRect( 1.0*s+ex, hy+3.2*s, 1.3*s, 1.5*s);
  } else if (p.face.y < -0.6){
    ctx.fillStyle = COL.hair; ctx.fillRect(-3.4*s, hy, 6.8*s, 5*s);
  } else {
    ctx.fillRect(-2.2*s+ex, hy+3.0*s, 1.4*s, 1.6*s);
    ctx.fillRect( 1.0*s+ex, hy+3.0*s, 1.4*s, 1.6*s);
  }
  ctx.restore();

  // 操作中マーカー
  if (p.humanTag && p.down <= 0){
    const c = p.humanTag === 'you' ? COL.warn : '#4dffb8';
    const yy = sy - 26*s + Math.sin(tclock*5)*1.6;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(sx-4, yy); ctx.lineTo(sx+4, yy); ctx.lineTo(sx, yy+5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
  }
  if (isGK){
    txt('GK', sx, sy - 23*s - (p.humanTag ? 10 : 2), { size:6, kind:'px', color:'#ffe9a8', ow:1 });
  }
}

function drawBall(){
  shadow(ball.x, ball.y, ball.r*1.05, ball.r*0.5, clamp(0.35 - ball.z*0.005, 0.08, 0.35));
  const [sx, sy, sc] = S(ball.x, ball.y, ball.z + ball.r);
  const r = ball.r * sc;
  ctx.fillStyle = COL.ball;
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(10,20,14,.85)'; ctx.stroke();
  // 回転する模様
  ctx.fillStyle = '#20261f';
  for (let i=0;i<3;i++){
    const a = ball.spin + i*2.09;
    ctx.fillRect(sx + Math.cos(a)*r*0.45 - 1, sy + Math.sin(a)*r*0.45 - 1, 2, 2);
  }
}

function drawField(dt){
  for (const p of players) updatePlayerAnim(p, dt);
  drawStadium();
  drawPitch();
  drawGoal('L'); drawGoal('R');
  // Y座標で奥から手前へ並べる
  const ents = players.map(p => ({ y:p.y, d:() => drawPlayer(p) }));
  ents.push({ y: ball.y + 0.5, d: drawBall });
  ents.sort((a,b) => a.y - b.y);
  for (const e of ents) e.d();
  drawWinds();
}

function drawHand(cx, cy, hand, dir, sc){
  sc = sc || 1;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  ctx.lineWidth = 1; ctx.strokeStyle = COL.ink;
  const F = (x,y,w,h,c) => { ctx.fillStyle = c || COL.skin; ctx.fillRect(x,y,w,h);
                             ctx.strokeRect(x+0.5,y+0.5,w-1,h-1); };
  const wrist = () => F(-9, 9, 18, 5, '#3c4a5c');            // そで
  if (hand == null || hand === 'hidden'){
    ctx.translate(0, Math.sin(tclock*13) * 5);
    F(-11,-9, 22, 18);
    for (let i=0;i<3;i++) F(-8+i*7, -6, 5, 4, '#dcae87');
    wrist();
    if (hand === 'hidden'){
      ctx.fillStyle = 'rgba(94,234,212,.85)'; ctx.fillRect(-11,-9,22,18);
      txt('OK', 0, 0, { size:8, kind:'px', color:'#07211c', ow:1, outline:'#bff7ec' });
    }
  } else if (hand === 'rock'){
    F(-11,-9, 22, 18);
    for (let i=0;i<3;i++) F(-8+i*7, -6, 5, 4, '#dcae87');
    F(-11, 2, 22, 4, '#dcae87');
    wrist();
  } else if (hand === 'scissors'){
    F(-6*dir-3, -20, 6, 15);
    F( 3*dir-3, -20, 6, 15);
    F(-11,-6, 22, 15);
    F(-11, 1, 22, 3, '#dcae87');
    wrist();
  } else {
    for (let i=0;i<4;i++) F(-11+i*6, -20, 5, 16);
    F(-12,-6, 24, 15);
    F(-12, 1, 24, 3, '#dcae87');
    wrist();
  }
  ctx.restore();
  if (hand && hand !== 'hidden') txt(HAND_JP[hand], cx, cy + 26*sc, { size:10, color:'#fff' });
}

function menuNav(items, state, onPick){
  let moved = 0;
  if (Key.hit('KeyW') || Key.hit('ArrowUp'))   moved = -1;
  if (Key.hit('KeyS') || Key.hit('ArrowDown')) moved =  1;
  if (moved){
    state.i = (state.i + moved + items.length) % items.length;
    Snd.se('se_ui_click', { vol:0.85 });
  }
  let side = 0;
  if (Key.hit('KeyA') || Key.hit('ArrowLeft'))  side = -1;
  if (Key.hit('KeyD') || Key.hit('ArrowRight')) side =  1;
  if (side && items[state.i].cycle){
    items[state.i].cycle(side);
    Snd.se('se_ui_click', { vol:0.8, rate:1.12 });
  }
  if (Key.hit('KeyO') || Key.hit('Enter') || Key.hit('Space')){
    Snd.se('se_ui_confirm', { vol:0.9 });
    onPick(items[state.i]);
  }
  if (clickPt){
    for (let i=0;i<items.length;i++){
      const b = items[i].box;
      if (b && clickPt.x>=b.x && clickPt.x<=b.x+b.w && clickPt.y>=b.y && clickPt.y<=b.y+b.h){
        if (state.i === i){ Snd.se('se_ui_confirm',{vol:0.9}); onPick(items[i]); }
        else { state.i = i; Snd.se('se_ui_click',{vol:0.85}); }
        break;
      }
    }
    clickPt = null;
  }
}

  txt(Net.pairOn ? '━━━' : dots, VW/2, cy-2, { size:12, color: Net.pairOn?'#5eead4':'#6b7683' });

  txt(Net.status, VW/2, 202, { size:11, color:'#9fe8dc' });
  if (Net.role === 'host' && Net.guestOn)
    txt('O または ENTER で じゅんびがめんへ', VW/2, 220, { size:11, color:'#ffd54d' });
  if (Net.role === 'guest')
    txt('ホストのそうさをまっています…', VW/2, 220, { size:11, color:'#ffd54d' });
  txt('ESC でタイトルへ', VW-10, VH-14, { size:9, color:'#8fa0b0', align:'right' });
}

/* ---- 試合 ---- */
let paused = false;
const pauseState = { i:0 };
const pauseItems = [
  { id:'resume', label:'つづける' },
  { id:'title',  label:'タイトルへもどる' },
];

function startMatch(){
  M.half = 1; M.halfLen = CFG.halfLen; M.timeLeft = CFG.halfLen;
  M.scoreA = M.scoreB = 0; M.state = 'playing'; M.dirA = 1; M.battleCool = 0;
  B.on = false; winds.length = 0; paused = false;
  for (const p of players){
    p.humanTag = null;
    p.mind = (p.team === 'A') ? CFG.mind : CFG.enemyMind;
  }
  byRole('A', CFG.role).humanTag = 'you';
  if (Net.role === 'host' && Net.guestOn){
    const other = ROLES.filter(r => r !== CFG.role)[0];
    byRole('A', other).humanTag = 'friend';
    Net.guestRole = other;
  }
  kickoff('A');
  gotoScene('match');
}

function updateMatchScene(dt){
  if (Key.hit('Space') && !B.on && M.state === 'playing' && Net.role !== 'guest'){
    paused = !paused;
    Snd.se('se_ui_click', { vol:0.9, rate: paused ? 0.85 : 1.15 });
    if (paused) Snd.loopOff('se_dribble_loop');
    pauseState.i = 0;
    return;
  }
  if (paused){
    menuNav(pauseItems, pauseState, it => {
      if (it.id === 'resume') paused = false;
      else { Net.leave(); gotoScene('title'); }
    });
    return;
  }
  if (Net.role === 'guest'){ camFollow(dt, ball.x, ball.y); updateWinds(dt); return; }
  updateMatch(dt);
}
function drawMatch(dt){
  drawField(dt);
  drawMatchHud();
  if (B.on) drawBattle();
  if (paused) drawPause();
}
function drawPause(){
  ctx.fillStyle = 'rgba(4,8,12,.78)'; ctx.fillRect(0,0,VW,VH);
  txt('ポーズ', VW/2, 78, { size:22, color:'#eafffb' });
  const bw = 200, x = (VW-bw)/2;
  pauseItems.forEach((it,i) => {
    const by = 124 + i*32;
    it.box = { x, y:by, w:bw, h:24 };
    const on = pauseState.i === i;
    panel(x, by, bw, 24, { fill: on?'rgba(94,234,212,.2)':'rgba(8,16,12,.8)',
      stroke: on?'#5eead4':'rgba(255,255,255,.3)', inner:false });
    txt(it.label, VW/2, by+12, { size:13, color: on?'#eafffb':'#c8d2dc' });
  });
  txt('SPACE でもどる', VW-10, VH-14, { size:9, color:'#8fa0b0', align:'right' });
}

/* ---- 結果 ---- */
const resultState = { i:0 };
const resultItems = [
  { id:'again', label:'もういちど' },
  { id:'lobby', label:'せっていをかえる' },
  { id:'title', label:'タイトルへ' },
];
function updateResult(dt){
  updateConfetti(dt);
  if (Net.role === 'guest') return;
  if (sceneT < 0.8) return;
  menuNav(resultItems, resultState, it => {
    if (it.id === 'again') startMatch();
    else if (it.id === 'lobby') gotoScene('lobby');
    else { Net.leave(); gotoScene('title'); }
  });
}
function drawResult(){
  const win = M.scoreA > M.scoreB, draw = M.scoreA === M.scoreB;
  bgResult(win);
  if (win) drawConfetti();

  const pop = clamp(sceneT*3.2, 0, 1);
  const yy = lerp(-30, 52, pop);
  const label = draw ? 'ドロー' : (win ? 'かち！' : 'まけ…');
  const c = draw ? '#dfe6ee' : (win ? '#ffd54d' : '#9fb3c6');
  txt(label, VW/2, yy, { size:30, color:c, outline: win?'#7a3b12':'#101820', ow:3 });

  panel(VW/2-96, 84, 192, 44, { fill:'rgba(6,12,10,.85)' });
  txt('YOU', VW/2-58, 98, { size:8, kind:'px', color:'#9fd0ff', ow:1 });
  txt('CPU', VW/2+58, 98, { size:8, kind:'px', color:'#ffb3b3', ow:1 });
  txt(String(M.scoreA), VW/2-58, 116, { size:16, kind:'px', color:'#fff', ow:2 });
  txt('-', VW/2, 114, { size:14, kind:'px', color:'#fff', ow:2 });
  txt(String(M.scoreB), VW/2+58, 116, { size:16, kind:'px', color:'#fff', ow:2 });

  if (sceneT > 0.8){
    const bw = 168, x = (VW-bw)/2;
    resultItems.forEach((it,i) => {
      const by = 148 + i*26;
      it.box = { x, y:by, w:bw, h:22 };
      const on = resultState.i === i;
      panel(x, by, bw, 22, { fill: on?'rgba(94,234,212,.2)':'rgba(8,16,12,.78)',
        stroke: on?'#5eead4':'rgba(255,255,255,.3)', inner:false });
      txt(it.label, VW/2, by+11, { size:12, color: on?'#eafffb':'#c8d2dc' });
    });
  }
  if (Net.role === 'guest') txt('ホストのそうさをまっています…', VW/2, VH-16, { size:10, color:'#9fe8dc' });
}

/* =========================================================================
   16. オンライン（Supabase Realtime / ホスト権威）
   ========================================================================= */
const SUPABASE_URL = 'https://zgqdkbjfvfllegoeellh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4jjuAhgQVo9-rB8X4tf9AA_1OrytjOO';

const Net = {
  sb: null, ch: null, room: null,
  id: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0,8),
  role: null, decided:false, pairOn:false, guestOn:false, guestRole:null,
  guestMv:{x:0,y:0}, guestShoot:false, guestPass:false, guestHand:null,
  status:'オフライン（ひとりプレイ）', timer:null,

  client(){
    if (!this.sb){
      if (!window.supabase){ this.status = '通信ライブラリを読み込めませんでした'; return null; }
      this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    return this.sb;
  },

  join(code){
    if (this.ch) return;
    const sb = this.client(); if (!sb) return;
    this.room = code;
    this.ch = sb.channel('soccer-' + code, { config:{ presence:{ key:this.id } } });

    // subscribe より前にすべて登録する
    this.ch.on('broadcast', { event:'input' }, m => {
      if (this.role !== 'host') return;
      const p = m.payload;
      if (p.mv) this.guestMv = p.mv;
      if (p.shoot) this.guestShoot = true;
      if (p.pass)  this.guestPass  = true;
      if (p.hand)  this.guestHand  = p.hand;
    });
    this.ch.on('broadcast', { event:'snap' }, m => {
      if (this.role === 'guest') this.applySnap(m.payload);
    });
    this.ch.on('presence', { event:'sync' }, () => {
      const st = this.ch.presenceState();
      const es = Object.entries(st).map(([k,v]) => ({ k, ts: v[0] ? v[0].ts : Infinity }));
      if (!es.length) return;
      es.sort((a,b) => a.ts-b.ts || (a.k < b.k ? -1 : 1));
      if (!this.decided && st[this.id]){
        this.role = (es[0].k === this.id) ? 'host' : 'guest';
        this.decided = true;
        this.onRole();
      }
      this.pairOn = es.length > 1;
      if (this.role === 'host'){
        if (this.pairOn !== this.guestOn){
          this.guestOn = this.pairOn;
          const fp = players.find(p => p.humanTag === 'friend');
          if (!this.guestOn && fp){ fp.humanTag = null; fp.vx = fp.vy = 0; }
          if (this.guestOn) Snd.se('se_ui_confirm', { vol:0.9 });
        }
        this.status = this.guestOn
          ? 'ホスト：あいてがさんかしました（' + this.room + '）'
          : 'ホスト：あいてをまっています（' + this.room + '）';
      } else if (this.role === 'guest'){
        this.status = 'ゲストとしてさんかちゅう（' + this.room + '）';
      }
    });

    this.ch.subscribe(async st => {
      if (st === 'SUBSCRIBED'){
        this.status = 'せつぞくちゅう…（' + code + '）';
        await this.ch.track({ ts: Date.now() });
      } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT'){
        this.status = 'せつぞくにしっぱいしました';
      }
    });
  },

  onRole(){
    Snd.se('se_ui_confirm', { vol:0.9 });
    if (this.role === 'host'){
      this.timer = setInterval(() => {
        if (this.ch) this.ch.send({ type:'broadcast', event:'snap', payload:this.buildSnap() });
      }, 60);
    } else {
      this.timer = setInterval(() => {
        if (!this.ch) return;
        const p = { mv: moveVec() };
        if (this.pendShoot){ p.shoot = true; this.pendShoot = false; }
        if (this.pendPass){ p.pass = true; this.pendPass = false; }
        if (this.pendHand){ p.hand = this.pendHand; this.pendHand = null; }
        this.ch.send({ type:'broadcast', event:'input', payload:p });
      }, 60);
    }
  },

  pushScene(){ /* snapshot に含めているので個別送信は不要 */ },

  buildSnap(){
    return {
      sc: scene, pa: paused,
      m: [M.half, M.timeLeft, M.scoreA, M.scoreB, M.state, M.dirA],
      b: [ball.x|0, ball.y|0, ball.z|0, ball.spin],
      p: players.map(p => [p.x|0, p.y|0, +p.face.x.toFixed(2), +p.face.y.toFixed(2),
                           +p.down.toFixed(2), p.humanTag === 'friend' ? 'you'
                           : (p.humanTag === 'you' ? 'friend' : null), p.role]),
      c: ball.carrier ? players.indexOf(ball.carrier) : -1,
      bt: B.on ? { a:players.indexOf(B.a), b:players.indexOf(B.b), ph:B.phase,
                   ha:B.handA, hb:B.handB, r:B.result, rd:B.round, t:B.t,
                   inter: (B.a.humanTag==='friend'||B.b.humanTag==='friend') } : null,
      cf: CFG,
    };
  },

  applySnap(s){
    if (scene !== s.sc) { scene = s.sc; sceneT = 0; netOverlay.classList.toggle('on', scene==='netwait');
      if (scene==='match') Snd.bgm('bgm_match');
      else if (scene==='lobby'||scene==='netwait') Snd.bgm('bgm_lobby');
      else if (scene==='title') Snd.bgm('bgm_title');
      else if (scene==='result') Snd.bgm(s.m[2] > s.m[3] ? 'bgm_lose' : 'bgm_win'); }
    paused = s.pa;
    M.half=s.m[0]; M.timeLeft=s.m[1]; M.scoreA=s.m[2]; M.scoreB=s.m[3]; M.state=s.m[4]; M.dirA=s.m[5];
    ball.x=s.b[0]; ball.y=s.b[1]; ball.z=s.b[2]; ball.spin=s.b[3];
    ball.carrier = s.c >= 0 ? players[s.c] : null;
    s.p.forEach((q,i) => {
      const p = players[i];
      p.x=q[0]; p.y=q[1]; p.face={x:q[2],y:q[3]}; p.down=q[4]; p.humanTag=q[5];
      if (Math.hypot(p.vx,p.vy) < 1) p.stepPhase += 0.12;
    });
    if (s.bt){
      B.on = true; B.a = players[s.bt.a]; B.b = players[s.bt.b];
      B.phase = s.bt.ph; B.handA = s.bt.ha; B.handB = s.bt.hb;
      B.result = s.bt.r; B.round = s.bt.rd; B.t = s.bt.t; B.interactive = s.bt.inter;
    } else B.on = false;
    if (s.cf){ CFG.role = s.cf.role; CFG.mind = s.cf.mind; CFG.halfLen = s.cf.halfLen; }
  },

  leave(){
    if (this.timer) clearInterval(this.timer);
    if (this.ch && this.sb) this.sb.removeChannel(this.ch);
    const fp = players.find(p => p.humanTag === 'friend');
    if (fp) fp.humanTag = null;
    this.ch=null; this.role=null; this.decided=false; this.pairOn=false;
    this.guestOn=false; this.timer=null;
    this.status = 'オフライン（ひとりプレイ）';
    roomInput.style.display=''; joinBtn.style.display=''; leaveBtn.style.display='none';
  },
};

joinBtn.addEventListener('click', () => {
  const code = (roomInput.value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8) || 'PARTY1';
  roomInput.value = code;
  Snd.boot().then(() => Snd.se('se_ui_confirm', { vol:0.9 }));
  Net.join(code);
  roomInput.style.display='none'; joinBtn.style.display='none'; leaveBtn.style.display='';
  const u = new URL(location.href); u.searchParams.set('room', code); history.replaceState(null,'',u);
});
leaveBtn.addEventListener('click', () => Net.leave());

// ゲストの入力を拾って送信キューへ
addEventListener('keydown', e => {
  if (Net.role !== 'guest') return;
  if (e.code === 'KeyO') Net.pendShoot = true;
  if (e.code === 'KeyP') Net.pendPass = true;
  if (e.code === 'Digit1') Net.pendHand = 'rock';
  if (e.code === 'Digit2') Net.pendHand = 'scissors';
  if (e.code === 'Digit3') Net.pendHand = 'paper';
});
// ホスト側でゲストのじゃんけんを反映
setInterval(() => {
  if (Net.role === 'host' && Net.guestHand && B.on && B.phase === 'pick'){
    if (B.a.humanTag === 'friend' && B.handA == null) B.handA = Net.guestHand;
    else if (B.b.humanTag === 'friend' && B.handB == null) B.handB = Net.guestHand;
    Net.guestHand = null;
  }
}, 50);

/* =========================================================================
   17. 左下HUD（音量・キー）
   ========================================================================= */
const volRange = document.getElementById('volRange');
const volNum = document.getElementById('volNum');
const muteBtn = document.getElementById('muteBtn');
const hudEl = document.getElementById('hud');

const savedVol = parseFloat(localStorage.getItem('dsoccer.vol'));
if (!isNaN(savedVol)){ volRange.value = Math.round(savedVol*100); }
function applyVol(){
  const v = volRange.value/100;
  volNum.textContent = volRange.value;
  Snd.setVol(v);
  try { localStorage.setItem('dsoccer.vol', String(v)); } catch(e){}
}
volRange.addEventListener('input', applyVol);
muteBtn.addEventListener('click', () => {
  const m = !Snd.muted;
  Snd.setMuted(m);
  muteBtn.textContent = m ? '🔇' : '♪';
  muteBtn.style.color = m ? '#f97362' : '';
});
document.getElementById('hudToggle').addEventListener('click', () => {
  hudEl.classList.toggle('min');
  document.getElementById('hudToggle').textContent = hudEl.classList.contains('min') ? '＋' : '−';
});

/* =========================================================================
   18. 起動とメインループ
   ========================================================================= */
const loadingEl = document.getElementById('loading');
let booted = false;
async function bootAudio(){
  if (booted) return;
  booted = true;
  loadingEl.textContent = 'LOADING SOUND…';
  loadingEl.classList.remove('off');
  try { await Snd.boot(); } catch(e){ console.warn(e); }
  Snd.setVol(volRange.value/100);
  loadingEl.classList.add('off');
  if (scene === 'title') Snd.bgm('bgm_title');
}
['keydown','pointerdown','touchstart'].forEach(ev =>
  addEventListener(ev, () => bootAudio(), { once:false }));

const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom){ roomInput.value = urlRoom.toUpperCase(); gotoScene('netwait'); }

kickoff('A');
applyVol();

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now; tclock += dt; sceneT += dt;

  if (scene === 'title')        updateTitle(dt);
  else if (scene === 'lobby')   updateLobby(dt);
  else if (scene === 'netwait') updateNetwait(dt);
  else if (scene === 'match')   updateMatchScene(dt);
  else if (scene === 'result')  updateResult(dt);

  ctx.clearRect(0,0,VW,VH);
  if (scene === 'title')        drawTitle();
  else if (scene === 'lobby')   drawLobby();
  else if (scene === 'netwait') drawNetwait();
  else if (scene === 'match')   drawMatch(dt);
  else if (scene === 'result')  drawResult();

  clickPt = null;
  Key.endFrame();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);

// デバッグ用に外へ出しておく（コンソールから触れる）
window.DS = { M, B, ball, players, CFG, Snd, Net, gotoScene, startMatch,
              get scene(){ return scene; } };
})();
